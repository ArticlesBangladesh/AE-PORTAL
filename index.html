    <SHdr title="Notices" action={<div style={{display:"flex",gap:8}}><Btn onClick={()=>{printContent("Notices",notices.map(n=>`<div class="card"><div style="display:flex;justify-content:space-between;"><h3>${n.title}</h3>${n.type?`<span class="badge badge-blue">${n.type}</span>`:""}</div><p style="font-size:12px;line-height:1.6;margin-top:6px;">${n.body}</p><p style="font-size:10px;color:#9ca3af;margin-top:6px;">${n.date}</p></div>`).join(""));}} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={()=>{setEditId(null);setForm(blank);setModal(true);}} color="teal">+ Add Notice</Btn></div>}/>
    {notices.length===0?<Empty icon="📌" msg="No notices yet."/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>{[...notices].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(n=><Card key={n.id} style={{padding:14}}>
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}}><span style={{fontWeight:800,color:N,fontSize:14}}>{n.title}</span>{n.type&&<Badge color={CM[n.type]||"gray"}>{n.type}</Badge>}</div>
      <p style={{fontSize:13,color:"#4b5563",lineHeight:1.6,margin:0}}>{n.body}</p>
      <div style={{fontSize:11,color:"#9ca3af",marginTop:5}}>{n.date}</div>
      <HR/>
      <div style={{display:"flex",gap:14}}>
        <button onClick={()=>{setEditId(n.id);setForm({...n});setModal(true);}} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
        <button onClick={()=>onDelete(n.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
      </div>
    </Card>)}
    </div>}
    {modal&&<Modal title={editId?"Edit Notice":"Add Notice"} onClose={()=>setModal(false)}>
      <FI label="Title" req value={form.title} onChange={e=>sf("title",e.target.value)}/>
      <FSel label="Type" options={TYPES} value={form.type} onChange={e=>sf("type",e.target.value)}/>
      <FI label="Date" type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
      <FTA label="Content" req value={form.body} onChange={e=>sf("body",e.target.value)} rows={4}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={save} color="teal" style={{flex:1}}>{editId?"Update":"Add"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
  </div>;
}

// ── NAV ───────────────────────────────────────────────────────────
const NAV=[
  {id:"adminAttendance",label:"My Attendance",    icon:"🏫"},
  {id:"students",       label:"Students",          icon:"🎓"},
  {id:"courses",        label:"Courses & Groups",  icon:"📚"},
  {id:"teachers",       label:"Teachers",          icon:"👩‍🏫"},
  {id:"fees",           label:"Monthly Fees",      icon:"💰"},
  {id:"teacherAttend",  label:"Teacher Attendance",icon:"⏰"},
  {id:"results",        label:"Exam Results",      icon:"📋"},
  {id:"sideIncome",     label:"Side Income",       icon:"💡"},
  {id:"events",         label:"Events",            icon:"🎉"},
  {id:"expenses",       label:"Expenses",          icon:"📤"},
  {id:"notices",        label:"Notices",           icon:"📌"},
  {id:"settings",       label:"Settings",          icon:"⚙️"},
];

const DEF_SETTINGS={classStart:"",subjects:[],paymentMethods:[],expenseCategories:[],centreName:"ARDENT Education",contactNo:"",address:"",logoSrc:null};

// ── ROOT APP ──────────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(()=>getSession());
  const [page,setPage]=useState("settings");
  const [sidebar,setSidebar]=useState(false);
  const [appLoading,setAppLoading]=useState(true);
  const [saving,setSaving]=useState(false);

  // Data state
  const [students,setStudents]=useState([]);
  const [teachers,setTeachers]=useState([]);
  const [attendance,setAttendance]=useState([]);
  const [adminAttendance,setAdminAttendance]=useState([]);
  const [enrollments,setEnrollments]=useState([]);
  const [feeRecords,setFeeRecords]=useState([]);
  const [notices,setNotices]=useState([]);
  const [sideIncome,setSideIncome]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [events,setEvents]=useState([]);
  const [results,setResults]=useState([]);
  const [settings,setSettings]=useState(DEF_SETTINGS);
  const [archivedStudents,setArchivedStudents]=useState([]);
  const [archivedTeachers,setArchivedTeachers]=useState([]);

  // Keep the print-branding + document title in sync with this user's settings
  useEffect(()=>{
    BRAND.name=settings.centreName||"ARDENT Education";
    BRAND.logo=settings.logoSrc||null;
    document.title=`${settings.centreName||"ARDENT Education"} — Admin Portal`;
  },[settings.centreName,settings.logoSrc]);

  // Load all data from Firebase when session is available
  useEffect(()=>{
    if(!session){setAppLoading(false);return;}
    loadAll();
  },[session]);

  async function loadAll(){
    setAppLoading(true);
    try{
      const u=session.username;
      const [sts,tcs,att,adm,enr,fees,not,si,exp,ev,res,arcSt,arcTc]=await Promise.all([
        fsGetAll(u,"students"),fsGetAll(u,"teachers"),fsGetAll(u,"attendance"),
        fsGetAll(u,"adminAttendance"),fsGetAll(u,"enrollments"),fsGetAll(u,"fees"),
        fsGetAll(u,"notices"),fsGetAll(u,"sideIncome"),fsGetAll(u,"expenses"),
        fsGetAll(u,"events"),fsGetAll(u,"results"),fsGetAll(u,"archivedStudents"),
        fsGetAll(u,"archivedTeachers")
      ]);
      const cfg=await fsGetSettings(u);
      setStudents(sts);setTeachers(tcs);setAttendance(att);setAdminAttendance(adm);
      setEnrollments(enr);setFeeRecords(fees);setNotices(not);setSideIncome(si);
      setExpenses(exp);setEvents(ev);setResults(res);setArchivedStudents(arcSt);setArchivedTeachers(arcTc);
      if(cfg){setSettings(cfg);setPage("adminAttendance");}
      else setPage("settings");
    }catch(e){console.error("Load error",e);}
    setAppLoading(false);
  }

  async function withSave(fn){setSaving(true);try{await fn();}catch(e){alert("Save error: "+e.message);}setSaving(false);}

  // ── Generic save helpers ──────────────────────────────────────
  const mkSave=(col,setFn)=>async(item)=>{
    setFn(prev=>{const exists=prev.find(x=>x.id===item.id);return exists?prev.map(x=>x.id===item.id?item:x):[...prev,item];});
    await withSave(()=>fsSave(session.username,col,item));
  };
  const mkDel=(col,setFn)=>async(id)=>{
    setFn(prev=>prev.filter(x=>x.id!==id));
    await withSave(()=>fsDelete(session.username,col,id));
  };

  // Settings
  const handleSaveSettings=async(data)=>{setSettings(data);await withSave(()=>fsSaveSettings(session.username,data));};

  // Students
  const handleSaveStudent=mkSave("students",setStudents);
  const handleDeleteStudent=async(id)=>{
    setStudents(p=>p.filter(x=>x.id!==id));setEnrollments(p=>p.filter(e=>e.studentId!==id));
    await withSave(async()=>{await fsDelete(session.username,"students",id);const myE=enrollments.filter(e=>e.studentId===id);for(const e of myE) await fsDelete(session.username,"enrollments",e.id);});
  };
  const handleSaveEnrollments=async(studentId,newE,allEnrollments)=>{
    const oldE=allEnrollments.filter(e=>e.studentId===studentId);
    setEnrollments(p=>[...p.filter(e=>e.studentId!==studentId),...newE]);
    await withSave(async()=>{for(const e of oldE) await fsDelete(session.username,"enrollments",e.id);for(const e of newE) await fsSave(session.username,"enrollments",e);});
  };
  const handleArchiveStudent=async(student,reason,allEnrollments)=>{
    const archived={...student,archivedAt:today(),archiveReason:reason,originalEnrollments:allEnrollments.filter(e=>e.studentId===student.id)};
    setArchivedStudents(p=>[...p,archived]);setStudents(p=>p.filter(s=>s.id!==student.id));setEnrollments(p=>p.filter(e=>e.studentId!==student.id));
    await withSave(async()=>{await fsSave(session.username,"archivedStudents",archived);await fsDelete(session.username,"students",student.id);const myE=allEnrollments.filter(e=>e.studentId===student.id);for(const e of myE) await fsDelete(session.username,"enrollments",e.id);});
  };
  const handleRestoreStudent=async(archived)=>{
    const {archivedAt,archiveReason,originalEnrollments,...student}=archived;
    const restored={...student,restoredAt:today()};
    setStudents(p=>[...p,restored]);setArchivedStudents(p=>p.filter(s=>s.id!==archived.id));
    if(originalEnrollments?.length) setEnrollments(p=>[...p.filter(e=>e.studentId!==archived.id),...originalEnrollments]);
    await withSave(async()=>{await fsSave(session.username,"students",restored);await fsDelete(session.username,"archivedStudents",archived.id);if(originalEnrollments?.length) for(const e of originalEnrollments) await fsSave(session.username,"enrollments",e);});
    alert(`✅ ${archived.name} restored!`);
  };
  const handleDeleteArchivedStudent=mkDel("archivedStudents",setArchivedStudents);

  // Teachers
  const handleSaveTeacher=mkSave("teachers",setTeachers);
  const handleDeleteTeacher=async(id)=>{
    setTeachers(p=>p.filter(x=>x.id!==id));setEnrollments(p=>p.filter(e=>e.teacherId!==id));
    await withSave(async()=>{await fsDelete(session.username,"teachers",id);const myE=enrollments.filter(e=>e.teacherId===id);for(const e of myE) await fsDelete(session.username,"enrollments",e.id);});
  };
  const handleDeleteTeacherEnrollments=async(teacherId)=>{
    setEnrollments(p=>p.filter(e=>e.teacherId!==teacherId));
    await withSave(async()=>{const myE=enrollments.filter(e=>e.teacherId===teacherId);for(const e of myE) await fsDelete(session.username,"enrollments",e.id);});
  };
  const handleArchiveTeacher=async(teacher,reason,allEnrollments)=>{
    const archived={...teacher,archivedAt:today(),archiveReason:reason,originalEnrollments:allEnrollments.filter(e=>e.teacherId===teacher.id)};
    setArchivedTeachers(p=>[...p,archived]);setTeachers(p=>p.filter(t=>t.id!==teacher.id));setEnrollments(p=>p.filter(e=>e.teacherId!==teacher.id));
    await withSave(async()=>{await fsSave(session.username,"archivedTeachers",archived);await fsDelete(session.username,"teachers",teacher.id);const myE=allEnrollments.filter(e=>e.teacherId===teacher.id);for(const e of myE) await fsDelete(session.username,"enrollments",e.id);});
  };
  const handleRestoreTeacher=async(archived)=>{
    const {archivedAt,archiveReason,originalEnrollments,...teacher}=archived;
    const restored={...teacher,restoredAt:today()};
    setTeachers(p=>[...p,restored]);setArchivedTeachers(p=>p.filter(t=>t.id!==archived.id));
    await withSave(async()=>{await fsSave(session.username,"teachers",restored);await fsDelete(session.username,"archivedTeachers",archived.id);});
    alert(`✅ ${archived.name} restored!`);
  };
  const handleDeleteArchivedTeacher=mkDel("archivedTeachers",setArchivedTeachers);

  // Admin attendance
  const handleAddAdminAtt=async(rec)=>{
    setAdminAttendance(p=>[...p.filter(r=>r.date!==rec.date),rec]);
    await withSave(()=>fsSave(session.username,"adminAttendance",rec));
  };
  const handleEditAdminAtt=handleAddAdminAtt;

  // Other collections
  const handleSaveAtt=mkSave("attendance",setAttendance);
  const handleDeleteAtt=mkDel("attendance",setAttendance);
  const handleSaveFee=mkSave("fees",setFeeRecords);
  const handleDeleteFee=mkDel("fees",setFeeRecords);
  const handleSaveNotice=mkSave("notices",setNotices);
  const handleDeleteNotice=mkDel("notices",setNotices);
  const handleSaveSI=mkSave("sideIncome",setSideIncome);
  const handleDeleteSI=mkDel("sideIncome",setSideIncome);
  const handleSaveExp=mkSave("expenses",setExpenses);
  const handleDeleteExp=mkDel("expenses",setExpenses);
  const handleSaveEvent=mkSave("events",setEvents);
  const handleDeleteEvent=mkDel("events",setEvents);
  const handleSaveResult=mkSave("results",setResults);
  const handleDeleteResult=mkDel("results",setResults);

  function handleLogin(sess){setSession(sess);}

  function handleLogout(){
    if(!window.confirm("Log out?"))return;
    clearSession();setSession(null);setPage("settings");
    setStudents([]);setTeachers([]);setAttendance([]);setAdminAttendance([]);
    setEnrollments([]);setFeeRecords([]);setNotices([]);setSideIncome([]);
    setExpenses([]);setEvents([]);setResults([]);setSettings(DEF_SETTINGS);
    setArchivedStudents([]);setArchivedTeachers([]);
  }

  // ── Loading ───────────────────────────────────────────────────
  if(appLoading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0c1445,#0f1e6b)"}}>
    <div style={{textAlign:"center"}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><ArdentLogo size={60} showText={false} logoSrc={settings.logoSrc}/></div>
      <div style={{fontSize:44,fontWeight:900,color:"#fff",fontFamily:"'Playfair Display',serif",letterSpacing:"-1px"}}>{settings.centreName||"OP"}</div>
      <div style={{display:"flex",gap:5,justifyContent:"center",marginTop:24}}>{[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:"#fbbf24",animation:"bounce 1s infinite",animationDelay:`${i*0.15}s`}}/>)}</div>
      {session&&<div style={{color:"rgba(255,255,255,0.4)",fontSize:12,marginTop:16}}>Loading your data from Firebase…</div>}
    </div>
  </div>;

  if(!session) return <LoginScreen onLogin={handleLogin}/>;

  const needsSetup=!settings.classStart;

  return <div className="app-layout" style={{minHeight:"100vh",display:"flex",background:"#f0f2f8"}}>
    <SyncBadge saving={saving}/>
    <aside className={`sidebar${sidebar?" open":""}`} style={{width:230,background:"#0c1445",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"20px 18px 16px",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
        <ArdentLogo size={36} showText={true} textColor="#fff" subColor="#fbbf24" logoSrc={settings.logoSrc} name={settings.centreName||"OP"}/>
      </div>
      <div style={{padding:"8px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",alignItems:"center",gap:7}}>
        <div style={{width:24,height:24,borderRadius:"50%",background:"#fbbf24",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#0c1445",flexShrink:0}}>{(session.username||"?")[0].toUpperCase()}</div>
        <span style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.6)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>@{session.username}</span>
        <div title="Firebase connected" style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:"#34d399",animation:"pulse 2s infinite",flexShrink:0}}/>
      </div>
      <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
        {NAV.map(n=><button key={n.id} onClick={()=>{setPage(n.id);setSidebar(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"8px 11px",borderRadius:10,border:"none",cursor:"pointer",fontSize:12,textAlign:"left",marginBottom:1,...(page===n.id?{background:"#fbbf24",color:"#0c1445",fontWeight:800}:{background:"transparent",color:"#c7d2fe",fontWeight:600})}}>
          <span>{n.icon}</span><span style={{flex:1}}>{n.label}</span>
          {n.id==="settings"&&needsSetup&&<span style={{width:6,height:6,borderRadius:"50%",background:"#f87171",flexShrink:0}}/>}
        </button>)}
      </nav>
      <div style={{padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.08)"}}>
        <button onClick={handleLogout} style={{width:"100%",padding:"8px 12px",borderRadius:9,border:"1px solid rgba(255,255,255,0.12)",background:"transparent",color:"rgba(255,255,255,0.4)",fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"left"}}>🚪 Log Out</button>
      </div>
    </aside>

    {sidebar&&<div className="overlay show" onClick={()=>setSidebar(false)}/>}

    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>
      <header className="mobile-header" style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"11px 14px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:20,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <button onClick={()=>setSidebar(true)} style={{fontSize:20,fontWeight:900,color:N,background:"none",border:"none",cursor:"pointer"}}>☰</button>
        <ArdentLogo size={28} showText={true} textColor={N} subColor={AM} logoSrc={settings.logoSrc} name={settings.centreName||"OP"}/>
      </header>
      <main style={{flex:1,overflowY:"auto",padding:"20px 14px"}}>
        <div style={{maxWidth:700,margin:"0 auto",width:"100%"}}>
          {page==="settings"&&<Settings settings={settings} onSave={handleSaveSettings} session={session} onLogout={handleLogout} saving={saving}/>}
          {page==="adminAttendance"&&<AdminAttendance adminAttendance={adminAttendance} onAdd={handleAddAdminAtt} onEdit={handleEditAdminAtt} settings={settings}/>}
          {page==="students"&&<Students students={students} onSave={handleSaveStudent} onDelete={handleDeleteStudent} teachers={teachers} enrollments={enrollments} onSaveEnrollments={handleSaveEnrollments} settings={settings} results={results} archivedStudents={archivedStudents} onArchive={handleArchiveStudent} onRestore={handleRestoreStudent} onDeleteArchived={handleDeleteArchivedStudent}/>}
          {page==="courses"&&<Courses students={students} teachers={teachers} enrollments={enrollments} settings={settings}/>}
          {page==="teachers"&&<Teachers teachers={teachers} onSave={handleSaveTeacher} onDelete={handleDeleteTeacher} students={students} enrollments={enrollments} onDeleteEnrollments={handleDeleteTeacherEnrollments} settings={settings} archivedTeachers={archivedTeachers} onArchive={handleArchiveTeacher} onRestore={handleRestoreTeacher} onDeleteArchived={handleDeleteArchivedTeacher}/>}
          {page==="fees"&&<Fees students={students} feeRecords={feeRecords} onSave={handleSaveFee} onDelete={handleDeleteFee} enrollments={enrollments} teachers={teachers} settings={settings}/>}
          {page==="teacherAttend"&&<TeacherAttendance attendance={attendance} onSave={handleSaveAtt} onDelete={handleDeleteAtt} teachers={teachers} settings={settings}/>}
          {page==="results"&&<Results results={results} onSave={handleSaveResult} onDelete={handleDeleteResult} students={students} teachers={teachers} settings={settings}/>}
          {page==="sideIncome"&&<SideIncome sideIncome={sideIncome} onSave={handleSaveSI} onDelete={handleDeleteSI} students={students} settings={settings}/>}
          {page==="events"&&<Events events={events} onSave={handleSaveEvent} onDelete={handleDeleteEvent} students={students}/>}
          {page==="expenses"&&<Expenses expenses={expenses} onSave={handleSaveExp} onDelete={handleDeleteExp} settings={settings}/>}
          {page==="notices"&&<Notices notices={notices} onSave={handleSaveNotice} onDelete={handleDeleteNotice}/>}
        </div>
      </main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
