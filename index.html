// ── Simple hash for password (not cryptographic, but prevents plaintext storage) ──
function simpleHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
  return (h >>> 0).toString(36) + str.length.toString(36);
}

// ── Session storage (localStorage only for session token) ─────────
const SESSION_KEY = "ae_session_v2";
function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } }
function setSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }

<script type="text/babel">

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

// Fee eligibility: a student only owes fees starting the month they joined.
const isEligibleForMonth=(student,month)=>{
  if(!student||!month)return true;
  if(!student.joinDate)return true; // no join date on file — don't hide them
  const joinYM=student.joinDate.slice(0,7);
  return joinYM<=month;
};

// ── Colors ────────────────────────────────────────────────────────
const N="#0c1445",AM="#f59e0b",GR="#059669",RE="#ef4444",TE="#0d9488",PU="#7c3aed";

// ── Firestore helpers ─────────────────────────────────────────────
// All data lives under: ardent_data/{username}/{collection}/{docId}
// User accounts: ardent_accounts/{username}

async function fsLogin(username, password) {
  const uKey = username.toLowerCase().trim();
  const snap = await db.collection("ardent_accounts").doc(uKey).get();
  if (!snap.exists) throw new Error("Account not found. Please create an account first.");
  const data = snap.data();
  const ph = simpleHash(password + uKey + "ardent2024");
  if (data.passwordHash !== ph) throw new Error("Incorrect password.");
  return { username: uKey, displayName: data.displayName || uKey };
}

async function fsRegister(username, password, displayName) {
  const uKey = username.toLowerCase().trim();
  const snap = await db.collection("ardent_accounts").doc(uKey).get();
  if (snap.exists) throw new Error("Username already taken. Please choose another.");
  const ph = simpleHash(password + uKey + "ardent2024");
  await db.collection("ardent_accounts").doc(uKey).set({
    passwordHash: ph,
    displayName: displayName || uKey,
    createdAt: new Date().toISOString()
  });
  return { username: uKey, displayName: displayName || uKey };
}

// Generic CRUD for a user's collection
function userCol(username, col) {
  return db.collection("ardent_data").doc(username).collection(col);
}

// Settings: single doc
async function fsGetSettings(username) {
  const snap = await db.collection("ardent_data").doc(username).collection("settings").doc("main").get();
  return snap.exists ? snap.data() : null;
}
async function fsSaveSettings(username, data) {
  await db.collection("ardent_data").doc(username).collection("settings").doc("main").set(data);
}

// Collection helpers
async function fsGetAll(username, col) {
  const snap = await userCol(username, col).get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fsSave(username, col, item) {
  const { id, ...data } = item;
  await userCol(username, col).doc(id).set(data);
}
async function fsDelete(username, col, id) {
  await userCol(username, col).doc(id).delete();
}
async function fsSaveMany(username, col, items) {
  const batch = db.batch();
  items.forEach(item => {
    const { id, ...data } = item;
    batch.set(userCol(username, col).doc(id), data);
  });
  await batch.commit();
}

// ── LOGIN SCREEN ──────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [username,setUsername]=useState(()=>localStorage.getItem("ae_saved_user")||"");
  const [displayName,setDisplayName]=useState("");
  const [password,setPassword]=useState("");
  const [showPass,setShowPass]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [remember,setRemember]=useState(!!localStorage.getItem("ae_saved_user"));

  async function handleSubmit(){
    setError("");
    if(!username.trim()) return setError("Username is required.");
    if(!password.trim()) return setError("Password is required.");
    if(mode==="register"&&password.length<6) return setError("Password must be at least 6 characters.");
    setLoading(true);
    try{
      let sess;
      if(mode==="login") sess=await fsLogin(username,password);
      else sess=await fsRegister(username,password,displayName);
      if(remember) localStorage.setItem("ae_saved_user",username.toLowerCase().trim());
      else localStorage.removeItem("ae_saved_user");
      setSession(sess);
      onLogin(sess);
    }catch(e){ setError(e.message||"Something went wrong."); }
    setLoading(false);
  }

  const IS2={width:"100%",border:"1.5px solid rgba(255,255,255,0.15)",borderRadius:12,padding:"12px 14px",fontSize:14,background:"rgba(255,255,255,0.08)",color:"#fff",outline:"none"};

  return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0c1445 0%,#0f2060 50%,#0c1445 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",top:-100,right:-100,width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle,rgba(251,191,36,0.08) 0%,transparent 70%)",pointerEvents:"none"}}/>
    <div style={{position:"absolute",bottom:-150,left:-150,width:500,height:500,borderRadius:"50%",background:"radial-gradient(circle,rgba(99,102,241,0.08) 0%,transparent 70%)",pointerEvents:"none"}}/>
    <div className="slide-up" style={{width:"100%",maxWidth:420,background:"rgba(255,255,255,0.05)",backdropFilter:"blur(20px)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:24,padding:36,boxShadow:"0 30px 80px rgba(0,0,0,0.4)"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><ArdentLogo size={52} showText={false}/></div>
        <div style={{fontSize:32,fontWeight:900,color:"#fff",fontFamily:"'Playfair Display',serif",letterSpacing:"-1px",lineHeight:1}}>OP</div>
        <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginTop:6}}>
          <div style={{flex:1,height:1,background:"rgba(251,191,36,0.3)"}}/>
          <span style={{fontSize:10,fontWeight:700,color:"#fbbf24",textTransform:"uppercase",letterSpacing:"0.3em"}}>Admin Portal</span>
          <div style={{flex:1,height:1,background:"rgba(251,191,36,0.3)"}}/>
        </div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",marginTop:10}}>{mode==="login"?"Welcome back — sign in to continue":"Create your admin account"}</div>
      </div>

      {/* Mode toggle */}
      <div style={{display:"flex",background:"rgba(255,255,255,0.06)",borderRadius:12,padding:4,marginBottom:24,gap:4}}>
        {["login","register"].map(m=><button key={m} onClick={()=>{setMode(m);setError("");}} style={{flex:1,padding:"9px",borderRadius:9,border:"none",fontSize:13,fontWeight:700,cursor:"pointer",...(mode===m?{background:"#fbbf24",color:"#0c1445"}:{background:"transparent",color:"rgba(255,255,255,0.5)"})}}>{m==="login"?"Sign In":"Create Account"}</button>)}
      </div>

      {mode==="register"&&<div style={{marginBottom:14}}>
        <label style={{display:"block",fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.5)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Display Name (optional)</label>
        <input value={displayName} onChange={e=>setDisplayName(e.target.value)} placeholder="e.g. Admin Rahman" style={IS2}/>
      </div>}

      <div style={{marginBottom:14}}>
        <label style={{display:"block",fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.5)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Username</label>
        <input value={username} onChange={e=>setUsername(e.target.value)} placeholder="e.g. admin" style={IS2} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
      </div>

      <div style={{marginBottom:20}}>
        <label style={{display:"block",fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.5)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Password</label>
        <div style={{display:"flex",gap:6}}>
          <input type={showPass?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" style={{...IS2,flex:1}} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
          <button onClick={()=>setShowPass(p=>!p)} style={{padding:"10px 12px",borderRadius:10,border:"1.5px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.6)",fontSize:11,fontWeight:700}}>{showPass?"Hide":"Show"}</button>
        </div>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,cursor:"pointer"}} onClick={()=>setRemember(p=>!p)}>
        <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${remember?"#fbbf24":"rgba(255,255,255,0.25)"}`,background:remember?"#fbbf24":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>

        </div>
        <span style={{fontSize:13,color:"rgba(255,255,255,0.6)",fontWeight:600}}>Remember me on this device</span>

      {error&&<div style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#fca5a5",marginBottom:16,fontWeight:600}}>{error}</div>}

      <button onClick={handleSubmit} disabled={loading} style={{width:"100%",padding:"13px",borderRadius:12,border:"none",background:loading?"rgba(251,191,36,0.4)":"#fbbf24",color:"#0c1445",fontWeight:800,fontSize:15,cursor:loading?"not-allowed":"pointer"}}>
        {loading?"Please wait…":mode==="login"?"Sign In →":"Create Account →"}

      <div style={{marginTop:20,padding:"14px",background:"rgba(255,255,255,0.04)",borderRadius:12,border:"1px solid rgba(255,255,255,0.08)"}}>
        <p style={{fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.6}}>
          <b style={{color:"rgba(255,255,255,0.6)"}}>First time?</b> Create an account — your data syncs to Firebase automatically across all devices. Each admin has their own private data space.
        </p>
      </div>
    </div>
  </div>;
}

// ── Subject-Fees Editor ───────────────────────────────────────────
function SubjectFeeEditor({assignments,onChange,teachers,subjects}){
  const [tId,setTId]=useState("");const [subj,setSubj]=useState("");const [fee,setFee]=useState("");
  const avail=useMemo(()=>{if(!tId)return subjects||[];const t=teachers.find(t=>t.id===tId);return(t?.subjects||[]).length?t.subjects:subjects||[];},[tId,teachers,subjects]);
  function add(){
    if(!tId||!subj)return alert("Select teacher and subject.");
    if(!fee||isNaN(+fee)||+fee<0)return alert("Enter a valid fee.");
    if((assignments||[]).find(a=>a.teacherId===tId&&a.subject===subj))return alert("Already assigned.");
    onChange([...(assignments||[]),{id:uid(),teacherId:tId,subject:subj,subjectFee:+fee}]);
    setTId("");setSubj("");setFee("");
  }
  return <div style={{marginBottom:14}}>
    <FL label="Subject → Teacher → Fee" req/>
    <div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden",marginBottom:8}}>
      {!(assignments||[]).length?<p style={{fontSize:12,color:"#9ca3af",padding:"10px 14px"}}>No assignments yet.</p>
      :(assignments||[]).map(a=>{const t=teachers.find(t=>t.id===a.teacherId);return <div key={a.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 14px",borderBottom:"1px solid #f5f5f5",flexWrap:"wrap",gap:4}}>
        <span style={{fontSize:12,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}><Badge color="blue">{a.subject}</Badge><span style={{color:"#6b7280"}}>→ {t?.name||"—"}</span><Badge color="green">{fmt(a.subjectFee)}</Badge></span>
        <button onClick={()=>onChange((assignments||[]).filter(x=>x.id!==a.id))} style={{background:"none",border:"none",color:"#fca5a5",fontSize:18,fontWeight:700,cursor:"pointer"}}>×</button>
      </div>;})}
    </div>
    {teachers.length===0?<p style={{fontSize:12,color:"#d97706",background:"#fffbeb",borderRadius:8,padding:"8px 12px"}}>Add teachers first.</p>
    :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <select value={tId} onChange={e=>{setTId(e.target.value);setSubj("");}} style={{...IS,flex:1,minWidth:110,fontSize:12}}><option value="">Teacher</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
      <select value={subj} onChange={e=>setSubj(e.target.value)} style={{...IS,flex:1,minWidth:100,fontSize:12}}><option value="">Subject</option>{avail.map(s=><option key={s} value={s}>{s}</option>)}</select>
      <input type="number" value={fee} onChange={e=>setFee(e.target.value)} placeholder="Fee ৳" style={{...IS,flex:1,minWidth:80,fontSize:12}} onFocus={focusIn} onBlur={focusOut}/>
      <Btn onClick={add} color="teal" style={{padding:"8px 12px",fontSize:12}}>+ Add</Btn>
    </div>}
  </div>;
}

  ${htmlContent}
  <div class="footer"><span>${BRAND.name} Admin Portal</span><span>Powered by Firebase</span></div>

    const file=e.target.files[0];

      </div>

    {/* Account */}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div><div style={{fontWeight:700,color:N,fontSize:14}}>@{session.username}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>Your data is private and secured in Firebase</div></div>

    <Card style={{padding:18,marginBottom:14}}>

// ── ADMIN ATTENDANCE ──────────────────────────────────────────────
function AdminAttendance({adminAttendance,onAdd,onEdit,settings}){
  const CUTOFF=settings.classStart||"11:30";
  const LATE_WINDOW=10;
  const [editModal,setEditModal]=useState(null);

  const todayStr=today();
  const todayRec=adminAttendance.find(r=>r.date===todayStr);

  function calcStatus(checkIn){
    if(!checkIn)return"absent";
    const[ch,cm]=checkIn.split(":").map(Number);
    const[cuth,cutm]=CUTOFF.split(":").map(Number);
    const late=(ch*60+cm)-(cuth*60+cutm);
    if(late>LATE_WINDOW)return"late";
    return"present";
  }

  async function doCheckIn(){
    const t=nowTime();const status=calcStatus(t);
    const rec={id:uid(),date:todayStr,checkIn:t,status,cutoff:CUTOFF};
    await onAdd(rec);
  }

  async function savePastEdit(date,checkIn,absent){
    const existing=adminAttendance.find(r=>r.date===date);
    const status=absent?"absent":calcStatus(checkIn);
    const rec={id:existing?.id||uid(),date,checkIn:absent?"":checkIn,status,cutoff:CUTOFF,manualEdit:true};
    await onEdit(rec);
    setEditModal(null);
  }

  const monthRecs=[...adminAttendance].filter(r=>r.date.startsWith(thisMonth())).sort((a,b)=>b.date.localeCompare(a.date));
  const lates=adminAttendance.filter(r=>r.status==="late").length;
  const absents=adminAttendance.filter(r=>r.status==="absent").length;
  const total=adminAttendance.length;
  const SC={present:["#f0fdf4","#059669","#d1fae5"],late:["#fffbeb","#d97706","#fde68a"],absent:["#fef2f2","#dc2626","#fecaca"]};

  function handlePrint(){
    const rows=adminAttendance.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${r.date}</td><td>${r.checkIn||"—"}</td><td><span class="badge badge-${r.status==="present"?"green":r.status==="late"?"amber":"red"}">${r.status}</span></td><td>${r.cutoff||CUTOFF}</td></tr>`).join("");
    printContent("Admin Attendance Log",`<table><thead><tr><th>Date</th><th>Check-In</th><th>Status</th><th>Cutoff</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Admin Attendance" sub="Your personal daily check-in" action={<Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn>}/>
    <Card style={{padding:22,marginBottom:16,borderLeft:`4px solid ${todayRec?SC[todayRec.status]?.[1]:N}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Today — {todayStr}</div>
          {todayRec?<>
            <div style={{fontSize:26,fontWeight:800,color:SC[todayRec.status]?.[1]}}>{todayRec.status.charAt(0).toUpperCase()+todayRec.status.slice(1)}</div>
            <div style={{fontSize:13,color:"#6b7280",marginTop:4}}>Checked in at <b>{todayRec.checkIn||"—"}</b> (cutoff: {CUTOFF})</div>
          </>:<>
            <div style={{fontSize:20,fontWeight:800,color:"#9ca3af"}}>Not Checked In</div>
            <div style={{fontSize:12,color:"#9ca3af",marginTop:3}}>Cutoff: <b>{CUTOFF}</b> (+{LATE_WINDOW} min grace)</div>
          </>}
        </div>
        {!todayRec&&<Btn onClick={doCheckIn} color="green" style={{padding:"11px 22px",fontSize:14}}>✅ Check In Now</Btn>}
      </div>
    </Card>

    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
      <StatCard label="On Time" value={total-lates-absents} icon="✅" from={GR} to="#047857"/>
      <StatCard label="Late Days" value={lates} icon="⚠️" from={AM} to="#b45309"/>
      <StatCard label="Absent" value={absents} icon="❌" from={RE} to="#b91c1c"/>
    </div>

    <Card style={{padding:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
        <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",margin:0}}>This Month</p>
        <button onClick={()=>setEditModal({date:"",rec:null,isNew:true})} style={{fontSize:11,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>✏️ Add / Correct a Past Date</button>
      </div>
      {monthRecs.length===0?<Empty icon="📅" msg="No records this month."/>
      :<div style={{display:"flex",flexDirection:"column",gap:6}}>
        {monthRecs.map(r=>{const[bg,fc,bc]=SC[r.status]||SC.absent;return <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:bg,border:`1px solid ${bc}`,borderRadius:10}}>
          <div><div style={{fontWeight:700,fontSize:12,color:fc}}>{r.date}{r.manualEdit?" ✏️":""}</div><div style={{fontSize:11,color:"#6b7280",marginTop:1}}>Check-in: {r.checkIn||"—"}</div></div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Badge color={r.status==="present"?"green":r.status==="late"?"amber":"red"}>{r.status}</Badge>
            {r.date!==todayStr&&<button onClick={()=>setEditModal({date:r.date,rec:r,isNew:false})} title="Edit this record" style={{background:"none",border:"none",color:"#9ca3af",fontSize:13,cursor:"pointer"}}>✏️</button>}
          </div>
        </div>;})}
      </div>}
    </Card>

    {editModal&&<Modal title={editModal.isNew?"Add / Correct Past Attendance":`Edit — ${editModal.date}`} onClose={()=>setEditModal(null)}>
      <PastEditForm rec={editModal.rec} initialDate={editModal.date} allowDateEdit={editModal.isNew} todayStr={todayStr} onSave={savePastEdit} onClose={()=>setEditModal(null)}/>
    </Modal>}
  </div>;
}

function PastEditForm({rec,initialDate,allowDateEdit,todayStr,onSave,onClose}){
  const yest=new Date();yest.setDate(yest.getDate()-1);
  const defaultDate=initialDate||yest.toISOString().split("T")[0];
  const [date,setDate]=useState(defaultDate);
  const [absent,setAbsent]=useState(rec?.status==="absent"||false);
  const [checkIn,setCheckIn]=useState(rec?.checkIn||"");
  function handleSave(){
    if(!date)return alert("Select a date.");
    if(date>=todayStr)return alert("Only past dates can be added or corrected here.");
    if(!absent&&!checkIn)return alert("Enter a check-in time, or mark as absent.");
    onSave(date,checkIn,absent);
  }
  return <div>
    {allowDateEdit&&<FI label="Date" req type="date" max={todayStr} value={date} onChange={e=>setDate(e.target.value)}/>}
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setAbsent(false)} style={{flex:1,padding:"9px",borderRadius:10,border:`2px solid ${!absent?GR:"#e5e7eb"}`,background:!absent?"#f0fdf4":"#fff",color:!absent?GR:"#6b7280",fontWeight:700,fontSize:13,cursor:"pointer"}}>Present / Late</button>
      <button onClick={()=>setAbsent(true)} style={{flex:1,padding:"9px",borderRadius:10,border:`2px solid ${absent?RE:"#e5e7eb"}`,background:absent?"#fef2f2":"#fff",color:absent?RE:"#6b7280",fontWeight:700,fontSize:13,cursor:"pointer"}}>Absent</button>
    </div>
    {!absent&&<FI label="Check-In Time" req type="time" value={checkIn} onChange={e=>setCheckIn(e.target.value)}/>}
    <div style={{display:"flex",gap:10}}><Btn onClick={handleSave} color="amber" style={{flex:1}}>Save</Btn><Btn onClick={onClose} color="ghost">Cancel</Btn></div>
  </div>;
}

// ── STUDENTS ──────────────────────────────────────────────────────
function Students({students,onSave,onDelete,teachers,enrollments,onSaveEnrollments,settings,results,archivedStudents,onArchive,onRestore,onDeleteArchived}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);const [viewId,setViewId]=useState(null);
  const [search,setSearch]=useState("");const [courseFilter,setCourseFilter]=useState("");const [subjectFilter,setSubjectFilter]=useState("");
  const [activeTab,setActiveTab]=useState("active");const [archiveModal,setArchiveModal]=useState(null);const [restoreModal,setRestoreModal]=useState(null);
  const blank={studentId:"",name:"",contact:"",address:"",parentName:"",parentContact:"",course:"",enrolledSubjects:[],monthlyFee:"",joinDate:"",notes:"",assignments:[]};
  const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  const allCourses=[...new Set(students.map(s=>s.course).filter(Boolean))];
  const computedFee=(form.assignments||[]).reduce((s,a)=>s+(+a.subjectFee||0),0);

  const filtered=students.filter(s=>{
    const q=search.toLowerCase();
    const matchSearch=!search||[s.name,s.studentId,s.parentName].some(v=>(v||"").toLowerCase().includes(q));
    const matchCourse=!courseFilter||(s.course||"")===courseFilter;
    const matchSubject=!subjectFilter||(s.enrolledSubjects||[]).includes(subjectFilter);
    return matchSearch&&matchCourse&&matchSubject;
  });

  const filteredAlumni=(archivedStudents||[]).filter(s=>{
    const q=search.toLowerCase();
    return !search||[s.name,s.studentId,s.parentName].some(v=>(v||"").toLowerCase().includes(q));
  });

  function openAdd(){setEditId(null);setForm({...blank});setModal(true);}
  function openEdit(s){
    setEditId(s.id);
    const myA=enrollments.filter(e=>e.studentId===s.id).map(e=>({id:e.id,teacherId:e.teacherId,subject:e.subject,subjectFee:e.subjectFee||0}));
    setForm({...blank,...s,assignments:myA});setModal(true);
  }

  async function save(){
    if(!form.studentId.trim())return alert("Student ID required.");
    if(!form.name.trim())return alert("Name required.");
    if(!form.course.trim())return alert("Course required.");
    if(!(form.enrolledSubjects||[]).length)return alert("Select at least one subject.");
    if(!(form.assignments||[]).length)return alert("Assign at least one teacher.");
    const totalFee=(form.assignments||[]).reduce((s,a)=>s+(+a.subjectFee||0),0);
    if(totalFee<=0)return alert("Total fee must be greater than ৳0. Set a fee for each subject assignment above.");
    const sid=editId||uid();
    const {assignments, monthlyFee, ...rest}=form;
    const studentData={...rest,id:sid,monthlyFee:totalFee};
    await onSave(studentData);
    const newE=(form.assignments||[]).map(a=>({id:a.id||uid(),studentId:sid,teacherId:a.teacherId,subject:a.subject,subjectFee:a.subjectFee||0}));
    await onSaveEnrollments(sid,newE,enrollments);
    setModal(false);
  }

  const vs=students.find(s=>s.id===viewId);
  const vsEnroll=enrollments.filter(e=>e.studentId===viewId);
  const vsResults=results.filter(r=>r.studentId===viewId);

  const TabBtn=({id,label,count})=><button onClick={()=>setActiveTab(id)} style={{padding:"8px 16px",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,...(activeTab===id?{background:N,color:"#fff"}:{background:"#f3f4f6",color:"#6b7280"})}}>
    {label} <span style={{fontSize:11,opacity:.7}}>({count})</span>
  </button>;

  function handlePrintAll(){
    const rows=filtered.map(s=>`<tr><td>${s.studentId||"—"}</td><td><b>${s.name}</b></td><td>${s.course||"—"}</td><td>${(s.enrolledSubjects||[]).join(", ")||"—"}</td><td>${s.contact||"—"}</td><td>${s.parentName||"—"}</td><td>${s.monthlyFee?fmt(s.monthlyFee):"—"}</td></tr>`).join("");
    printContent("Student List",`<table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Subjects</th><th>Contact</th><th>Parent</th><th>Fee</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Students" sub={`${students.length} active · ${(archivedStudents||[]).length} alumni`}
      action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrintAll} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={openAdd}>+ Add Student</Btn></div>}/>

    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <TabBtn id="active" label="Active" count={students.length}/>
      <TabBtn id="alumni" label="📦 Alumni" count={(archivedStudents||[]).length}/>
    </div>

    {activeTab==="active"&&<>
      <Card style={{padding:14,marginBottom:14}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, ID, parent…" style={{...IS,fontSize:12}} onFocus={focusIn} onBlur={focusOut}/>
          <select value={courseFilter} onChange={e=>setCourseFilter(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Courses</option>{allCourses.map(c=><option key={c} value={c}>{c}</option>)}</select>
          <select value={subjectFilter} onChange={e=>setSubjectFilter(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Subjects</option>{(settings.subjects||[]).map(s=><option key={s} value={s}>{s}</option>)}</select>
        </div>
        {(courseFilter||subjectFilter||search)&&<button onClick={()=>{setCourseFilter("");setSubjectFilter("");setSearch("");}} style={{fontSize:11,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>✕ Clear</button>}
      </Card>
      {filtered.length===0?<Empty icon="🎓" msg="No students yet."/>
      :<div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.map(s=>{const myE=enrollments.filter(e=>e.studentId===s.id);return <Card key={s.id} style={{padding:14}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:14}}>{s.name}</span>
                {s.studentId&&<Badge color="navy">{s.studentId}</Badge>}
                {s.course&&<Badge color="purple">{s.course}</Badge>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{s.contact||"No contact"}{s.parentName?` · Parent: ${s.parentName}`:""}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{(s.enrolledSubjects||[]).map(sub=><Badge key={sub} color="blue">{sub}</Badge>)}</div>
              {myE.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <span key={e.id} style={{fontSize:10,background:"#f0fdf4",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:600}}>{e.subject} → {t?.name||"?"} {e.subjectFee?`(${fmt(e.subjectFee)})`:""}</span>;})}</div>}
            </div>
            {s.monthlyFee&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontWeight:800,color:AM,fontSize:14}}>{fmt(s.monthlyFee)}</div><div style={{fontSize:10,color:"#9ca3af"}}>/month</div></div>}
          </div>
          <HR/>
          <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
            <button onClick={()=>setViewId(s.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>View</button>
            <button onClick={()=>openEdit(s)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
            <button onClick={()=>setArchiveModal(s)} style={{fontSize:12,fontWeight:700,color:"#ea580c",background:"none",border:"none",cursor:"pointer"}}>📦 Archive</button>
            <button onClick={()=>{if(!window.confirm("Permanently delete?"))return;onDelete(s.id);}} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>;})}
      </div>}
    </>}

    {activeTab==="alumni"&&<>
      <InfoBox color="blue">📦 Archived students keep all data. Restore them anytime.</InfoBox>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search alumni…" style={{...IS,fontSize:12,marginBottom:14}} onFocus={focusIn} onBlur={focusOut}/>
      {filteredAlumni.length===0?<Empty icon="📦" msg="No archived students."/>
      :<div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filteredAlumni.map(s=><Card key={s.id} style={{padding:14,borderLeft:"4px solid #ea580c",opacity:.9}}>
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontWeight:800,color:"#374151",fontSize:14}}>{s.name}</span>
            {s.studentId&&<Badge color="gray">{s.studentId}</Badge>}
            <Badge color="orange">Inactive</Badge>
          </div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{s.contact}</div>
          <div style={{fontSize:11,marginTop:4}}><span style={{color:"#9ca3af"}}>Archived: <b>{s.archivedAt}</b></span> · <span style={{color:"#ea580c",fontWeight:600}}>{s.archiveReason}</span></div>
          <HR/>
          <div style={{display:"flex",gap:14}}>
            <button onClick={()=>setRestoreModal(s)} style={{fontSize:12,fontWeight:700,color:GR,background:"none",border:"none",cursor:"pointer"}}>↩ Restore</button>
            <button onClick={()=>{if(!window.confirm("Permanently delete?"))return;onDeleteArchived(s.id);}} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>)}
      </div>}
    </>}

    {modal&&<Modal title={editId?"Edit Student":"Add New Student"} onClose={()=>setModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <FI label="Student ID" req value={form.studentId} onChange={e=>sf("studentId",e.target.value)} placeholder="e.g. STU-001"/>
        <FI label="Full Name" req value={form.name} onChange={e=>sf("name",e.target.value)}/>
        <div style={{marginBottom:14}}>
          <FL label="Course" req/>
          <input list="course-options" value={form.course} onChange={e=>sf("course",e.target.value)} placeholder="Select existing or type a new course…" style={IS} onFocus={focusIn} onBlur={focusOut}/>
          <datalist id="course-options">{allCourses.map(c=><option key={c} value={c}/>)}</datalist>
        </div>
        <div style={{marginBottom:14}}>
          <FL label="Monthly Fee (৳)" req/>
          <div style={{...IS,background:"#f0fdf4",border:"1.5px solid #a7f3d0",color:"#065f46",fontWeight:800,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span>{fmt(computedFee)}</span>
            <span style={{fontSize:10,fontWeight:700,color:"#059669",textTransform:"uppercase"}}>auto-calculated</span>
          </div>
        </div>
        <FI label="Contact" value={form.contact} onChange={e=>sf("contact",e.target.value)}/>
        <FI label="Joining Date" type="date" value={form.joinDate} onChange={e=>sf("joinDate",e.target.value)}/>
        <FI label="Parent Name" value={form.parentName} onChange={e=>sf("parentName",e.target.value)}/>
        <FI label="Parent Contact" value={form.parentContact} onChange={e=>sf("parentContact",e.target.value)}/>
      </div>
      <FI label="Address" value={form.address} onChange={e=>sf("address",e.target.value)}/>
      <FM label="Enrolled Subjects" req options={settings.subjects||[]} selected={form.enrolledSubjects||[]} onChange={v=>sf("enrolledSubjects",v)}/>
      <SubjectFeeEditor assignments={form.assignments||[]} onChange={v=>sf("assignments",v)} teachers={teachers} subjects={settings.subjects||[]}/>
      <InfoBox color="green">Monthly fee is calculated automatically from the subject/teacher fees above — it always matches, so there's no risk of a mismatch.</InfoBox>
      <FTA label="Notes" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10,marginTop:6}}><Btn onClick={save} style={{flex:1}}>{editId?"Update":"Add Student"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {archiveModal&&<Modal title={`Archive — ${archiveModal.name}`} onClose={()=>setArchiveModal(null)}>
      <ArchiveModal type="student" name={archiveModal.name} onConfirm={(reason)=>{onArchive(archiveModal,reason,enrollments);setArchiveModal(null);}} onClose={()=>setArchiveModal(null)}/>
    </Modal>}

    {restoreModal&&<Modal title={`Restore — ${restoreModal.name}`} onClose={()=>setRestoreModal(null)}>
      <InfoBox color="green"><b>↩ Restore {restoreModal.name}?</b><br/>They'll be moved back to active students.</InfoBox>
      <div style={{display:"flex",gap:10}}><Btn onClick={()=>{onRestore(restoreModal);setRestoreModal(null);}} color="green" style={{flex:1}}>↩ Restore</Btn><Btn onClick={()=>setRestoreModal(null)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {vs&&<Modal title="Student Profile" onClose={()=>setViewId(null)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["ID",vs.studentId||"—"],["Name",vs.name],["Course",vs.course||"—"],["Contact",vs.contact||"—"],["Parent",vs.parentName||"—"],["Parent Contact",vs.parentContact||"—"],["Monthly Fee",vs.monthlyFee?fmt(vs.monthlyFee):"—"],["Join Date",vs.joinDate||"—"]].map(([k,v])=>(
          <div key={k} style={{background:"#f9fafb",borderRadius:10,padding:10}}><div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase"}}>{k}</div><div style={{fontWeight:700,color:"#1f2937",fontSize:13,marginTop:2}}>{v}</div></div>))}
      </div>
      {(vs.enrolledSubjects||[]).length>0&&<div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>Subjects</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{vs.enrolledSubjects.map(s=><Badge key={s} color="blue">{s}</Badge>)}</div></div>}
      <div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>Teacher Assignments</div>
        {vsEnroll.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <div key={e.id} style={{fontSize:12,marginBottom:5,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>• <Badge color="blue">{e.subject}</Badge><span>→ {t?.name||"—"}</span>{e.subjectFee?<Badge color="green">{fmt(e.subjectFee)}</Badge>:null}</div>;})}
      </div>
      {vsResults.length>0&&<div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>Recent Results</div>
        {vsResults.slice(0,3).map(r=><div key={r.id} style={{fontSize:12,display:"flex",gap:6,alignItems:"center",marginBottom:4}}><Badge color="purple">{r.examName}</Badge><Badge color="blue">{r.subject}</Badge><span style={{fontWeight:700}}>{r.score}/{r.totalMarks}</span>{r.grade&&<Badge color={r.grade==="A+"||r.grade==="A"?"green":r.grade==="F"?"red":"amber"}>{r.grade}</Badge>}</div>)}
      </div>}
      {vs.notes&&<div style={{background:"#fffbeb",borderRadius:10,padding:10,fontSize:13,color:"#92400e"}}><b>Notes: </b>{vs.notes}</div>}
    </Modal>}
  </div>;
}

// ── COURSES VIEW ──────────────────────────────────────────────────
function Courses({students,teachers,enrollments,settings}){
  const [viewMode,setViewMode]=useState("course"); // "course" | "teacher"
  const [selCourse,setSelCourse]=useState("");const [selSubject,setSelSubject]=useState("");const [selTeacher,setSelTeacher]=useState("");
  const [expandedTeacher,setExpandedTeacher]=useState(null);
  const allCourses=[...new Set(students.map(s=>s.course).filter(Boolean))];
  const filtered=students.filter(s=>{
    const matchCourse=!selCourse||(s.course||"")===selCourse;
    const matchSubject=!selSubject||(s.enrolledSubjects||[]).includes(selSubject);
    const matchTeacher=!selTeacher||enrollments.some(e=>e.studentId===s.id&&e.teacherId===selTeacher);
    return matchCourse&&matchSubject&&matchTeacher;
  });
  const byCourse={};
  if(!selCourse&&!selSubject&&!selTeacher) filtered.forEach(s=>{const c=s.course||"No Course";if(!byCourse[c])byCourse[c]=[];byCourse[c].push(s);});

  const TabBtn=({id,label})=><button onClick={()=>setViewMode(id)} style={{padding:"8px 16px",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,...(viewMode===id?{background:N,color:"#fff"}:{background:"#f3f4f6",color:"#6b7280"})}}>{label}</button>;

  return <div>
    <SHdr title="Courses & Groups" sub="Browse students by course, subject, or teacher"/>

    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <TabBtn id="course" label="📚 By Course"/>
      <TabBtn id="teacher" label="👩‍🏫 By Teacher"/>
    </div>

    {viewMode==="course"&&<>
      <Card style={{padding:14,marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          <div><FL label="Course"/><select value={selCourse} onChange={e=>setSelCourse(e.target.value)} style={IS}><option value="">All Courses</option>{allCourses.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
          <div><FL label="Subject"/><select value={selSubject} onChange={e=>setSelSubject(e.target.value)} style={IS}><option value="">All Subjects</option>{(settings.subjects||[]).map(s=><option key={s} value={s}>{s}</option>)}</select></div>
          <div><FL label="Teacher"/><select value={selTeacher} onChange={e=>setSelTeacher(e.target.value)} style={IS}><option value="">All Teachers</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
        </div>
        {(selCourse||selSubject||selTeacher)&&<button onClick={()=>{setSelCourse("");setSelSubject("");setSelTeacher("");}} style={{fontSize:11,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",marginTop:8}}>✕ Clear</button>}
      </Card>
      {(selCourse||selSubject||selTeacher)?
        <>
          <div style={{fontSize:13,fontWeight:700,color:"#6b7280",marginBottom:10}}>Showing {filtered.length} student(s)</div>
          {filtered.length===0?<Empty icon="🎓" msg="No students match."/>
          :<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {filtered.map(s=>{const myE=enrollments.filter(e=>e.studentId===s.id&&(!selTeacher||e.teacherId===selTeacher)&&(!selSubject||e.subject===selSubject));return <Card key={s.id} style={{padding:12}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:13}}>{s.name}</span>
                {s.studentId&&<Badge color="navy">{s.studentId}</Badge>}
                {s.course&&<Badge color="purple">{s.course}</Badge>}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <span key={e.id} style={{fontSize:10,background:"#f0fdf4",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:600}}>{e.subject} → {t?.name||"?"}</span>;})}</div>
            </Card>;})}
          </div>}
        </>:
        <>
          {students.length===0?<Empty icon="📚" msg="No students enrolled yet."/>
          :Object.entries(byCourse).sort(([a],[b])=>a.localeCompare(b)).map(([course,sts])=>(
            <Card key={course} style={{padding:0,marginBottom:14,overflow:"hidden"}}>
              <div style={{background:N,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:800,color:"#fff",fontSize:14}}>{course}</div>
                <Badge color="amber">{sts.length} student{sts.length!==1?"s":""}</Badge>
              </div>
              <div style={{padding:"8px 0"}}>
                {sts.map((s,i)=>{const myE=enrollments.filter(e=>e.studentId===s.id);return <div key={s.id} style={{padding:"8px 16px",borderBottom:i<sts.length-1?"1px solid #f5f5f5":"none"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,color:N,fontSize:13}}>{s.name}</span>
                    {s.studentId&&<Badge color="navy">{s.studentId}</Badge>}
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,marginLeft:4}}>{(s.enrolledSubjects||[]).map(sub=><Badge key={sub} color="blue">{sub}</Badge>)}</div>
                  </div>
                  {myE.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:2,marginTop:4}}>{myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <span key={e.id} style={{fontSize:10,background:"#f0fdf4",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:600}}>{e.subject} → {t?.name||"?"}</span>;})}</div>}
                </div>;})}
              </div>
            </Card>))}
        </>}
    </>}

    {viewMode==="teacher"&&<>
      {teachers.length===0?<Empty icon="👩‍🏫" msg="No teachers yet."/>
      :<div style={{display:"flex",flexDirection:"column",gap:10}}>

          return <Card key={t.id} style={{padding:0,overflow:"hidden"}}>
            <div onClick={()=>setExpandedTeacher(expanded?null:t.id)} style={{cursor:"pointer",padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",background:expanded?N:"#fff"}}>
              <div>
                <div style={{fontWeight:800,fontSize:14,color:expanded?"#fff":N}}>{t.name}</div>
                <div style={{fontSize:11,color:expanded?"rgba(255,255,255,0.6)":"#9ca3af",marginTop:2}}>{t.contact||""}{t.qualification?` · ${t.qualification}`:""}</div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <Badge color={expanded?"amber":"navy"}>{myStudents.length} student{myStudents.length!==1?"s":""}</Badge>

              {courses.length>0&&<div style={{marginBottom:14}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>Courses</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{courses.map(c=><Badge key={c} color="purple">{c}</Badge>)}</div></div>}
              {myStudents.length>0&&<>
                <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:6}}>Students & Fees</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {myStudents.map(s=>{const se=myE.filter(e=>e.studentId===s.id);return <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:"#f9fafb",borderRadius:8,flexWrap:"wrap",gap:4}}>
                    <div><span style={{fontWeight:700,fontSize:12,color:N}}>{s.name}</span>{s.course&&<span style={{fontSize:11,color:"#9ca3af",marginLeft:6}}>· {s.course}</span>}</div>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{se.map(e=><Badge key={e.id} color="green">{e.subject}: {fmt(e.subjectFee)}</Badge>)}</div>
                  </div>;})}
                </div>
              </>}
            </div>}
          </Card>;
        })}
      </div>}
    </>}
  </div>;
}

// ── TEACHERS ──────────────────────────────────────────────────────
function Teachers({teachers,onSave,onDelete,students,enrollments,onDeleteEnrollments,settings,archivedTeachers,onArchive,onRestore,onDeleteArchived}){

  function openAdd(){setEditId(null);setForm({...blank,schedule:blankSched()});setModal(true);}
  function openEdit(t){setEditId(t.id);setForm({...blank,...t,schedule:t.schedule||blankSched()});setModal(true);}

  async function save(){
    if(!form.name.trim())return alert("Name required.");

    if(!form.qualification.trim())return alert("Qualification required.");
    if(!(form.subjects||[]).length)return alert("Select at least one subject.");
    const hasAtLeastOneDay=DAYS.some(d=>form.schedule?.[d]?.active);

  const vt=teachers.find(t=>t.id===viewId);

  const TabBtn=({id,label,count})=><button onClick={()=>setActiveTab(id)} style={{padding:"8px 16px",borderRadius:10,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,...(activeTab===id?{background:AM,color:"#fff"}:{background:"#f3f4f6",color:"#6b7280"})}}>

  return <div>

    <div style={{display:"flex",gap:8,marginBottom:14}}>

    </div>

    {activeTab==="active"&&<>
      {teachers.length===0?<Empty icon="👩‍🏫" msg="No teachers yet."/>
      :<div style={{display:"flex",flexDirection:"column",gap:10}}>
        {teachers.map(t=>{const myS=[...new Set(enrollments.filter(e=>e.teacherId===t.id).map(e=>e.studentId))];const activeDays=DAYS.filter(d=>t.schedule?.[d]?.active);
        return <Card key={t.id} style={{padding:14}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:14}}>{t.name}</span>
                {t.teacherId&&<Badge color="amber">{t.teacherId}</Badge>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{t.contact}{t.qualification?` · ${t.qualification}`:""}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{(t.subjects||[]).map(s=><Badge key={s} color="teal">{s}</Badge>)}</div>
              {activeDays.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{activeDays.map(d=><span key={d} style={{fontSize:10,background:"#d1fae5",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:700}}>{DAYS_S[DAYS.indexOf(d)]} {t.schedule[d].startTime}</span>)}</div>}
            </div>
            <Badge color="navy">{myS.length} student{myS.length!==1?"s":""}</Badge>
          </div>
          <HR/>
          <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
            <button onClick={()=>setViewId(t.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>View</button>
            <button onClick={()=>openEdit(t)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
            <button onClick={()=>setArchiveModal(t)} style={{fontSize:12,fontWeight:700,color:"#ea580c",background:"none",border:"none",cursor:"pointer"}}>📦 Archive</button>
            <button onClick={()=>{if(!window.confirm("Delete?"))return;onDelete(t.id);onDeleteEnrollments(t.id);}} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>;})}
      </div>}
    </>}

    {activeTab==="archived"&&<>
      <InfoBox color="blue">Restore archived teachers anytime.</InfoBox>
      {(archivedTeachers||[]).length===0?<Empty icon="📦" msg="No archived teachers."/>
      :<div style={{display:"flex",flexDirection:"column",gap:10}}>
        {(archivedTeachers||[]).map(t=><Card key={t.id} style={{padding:14,borderLeft:"4px solid #ea580c"}}>
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontWeight:800,color:"#374151",fontSize:14}}>{t.name}</span>
            <Badge color="orange">Inactive</Badge>
          </div>
          <div style={{fontSize:11,marginTop:4}}><span style={{color:"#9ca3af"}}>Archived: <b>{t.archivedAt}</b></span> · <span style={{color:"#ea580c",fontWeight:600}}>{t.archiveReason}</span></div>
          <HR/>
          <div style={{display:"flex",gap:14}}>
            <button onClick={()=>setRestoreModal(t)} style={{fontSize:12,fontWeight:700,color:GR,background:"none",border:"none",cursor:"pointer"}}>↩ Restore</button>
            <button onClick={()=>{if(!window.confirm("Permanently delete?"))return;onDeleteArchived(t.id);}} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>)}
      </div>}
    </>}

    {modal&&<Modal title={editId?"Edit Teacher":"Add Teacher"} onClose={()=>setModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <FI label="Teacher ID" value={form.teacherId} onChange={e=>sf("teacherId",e.target.value)} placeholder="e.g. TCH-001"/>
        <FI label="Full Name" req value={form.name} onChange={e=>sf("name",e.target.value)}/>
        <FI label="Contact" req value={form.contact} onChange={e=>sf("contact",e.target.value)}/>
        <FI label="Qualification" req value={form.qualification} onChange={e=>sf("qualification",e.target.value)} placeholder="e.g. M.Sc"/>
        <FI label="Join Date" type="date" value={form.joinDate} onChange={e=>sf("joinDate",e.target.value)}/>
      </div>
      <FI label="Address" value={form.address} onChange={e=>sf("address",e.target.value)}/>
      <FTA label="Qualification Details" rows={2} value={form.qualDetails||""} onChange={e=>sf("qualDetails",e.target.value)}/>
      <FM label="Subjects" req options={settings.subjects||[]} selected={form.subjects||[]} onChange={v=>sf("subjects",v)}/>
      <WeeklyScheduleEditor schedule={form.schedule||blankSched()} onChange={v=>sf("schedule",v)}/>
      <FTA label="Notes" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10,marginTop:6}}><Btn onClick={save} color="amber" style={{flex:1}}>{editId?"Update":"Add Teacher"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {archiveModal&&<Modal title={`Archive — ${archiveModal.name}`} onClose={()=>setArchiveModal(null)}>
      <ArchiveModal type="teacher" name={archiveModal.name} onConfirm={(reason)=>{onArchive(archiveModal,reason,enrollments);setArchiveModal(null);}} onClose={()=>setArchiveModal(null)}/>
    </Modal>}
    {restoreModal&&<Modal title={`Restore — ${restoreModal.name}`} onClose={()=>setRestoreModal(null)}>
      <InfoBox color="green"><b>↩ Restore {restoreModal.name}?</b></InfoBox>
      <div style={{display:"flex",gap:10}}><Btn onClick={()=>{onRestore(restoreModal);setRestoreModal(null);}} color="green" style={{flex:1}}>↩ Restore</Btn><Btn onClick={()=>setRestoreModal(null)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {vt&&<Modal title="Teacher Profile" onClose={()=>setViewId(null)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["ID",vt.teacherId||"—"],["Name",vt.name],["Contact",vt.contact||"—"],["Qualification",vt.qualification||"—"],["Join Date",vt.joinDate||"—"]].map(([k,v])=>(
          <div key={k} style={{background:"#f9fafb",borderRadius:10,padding:10}}><div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase"}}>{k}</div><div style={{fontWeight:700,color:"#1f2937",fontSize:13,marginTop:2}}>{v}</div></div>))}
      </div>
      {(vt.subjects||[]).length>0&&<div style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>Subjects</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{vt.subjects.map(s=><Badge key={s} color="teal">{s}</Badge>)}</div></div>}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",marginBottom:5}}>Schedule</div>

          {DAYS.map((day,i)=>{const info=vt.schedule?.[day];const has=info?.active;return <div key={day} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 12px",borderBottom:i<6?"1px solid #f3f4f6":"none",background:has?"#f0fdf4":"#fafafa"}}>

// ── MONTHLY FEES ──────────────────────────────────────────────────
function Fees({students,feeRecords,onSave,onDelete,enrollments,teachers,settings}){
  const [month,setMonth]=useState(thisMonth());const [modal,setModal]=useState(false);const [histId,setHistId]=useState(null);const [editRecId,setEditRecId]=useState(null);
  const blank={studentId:"",month:thisMonth(),amountPaid:"",paidDate:today(),paymentMethod:"",notes:""};
  const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<18;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);
  const eligibleStudents=useMemo(()=>students.filter(st=>isEligibleForMonth(st,month)),[students,month]);
  const mRecs=feeRecords.filter(r=>r.month===month);
  const collected=mRecs.reduce((s,r)=>s+(+r.amountPaid||0),0);
  const totalDue=eligibleStudents.reduce((s,st)=>s+(+st.monthlyFee||0),0);
  const pct=totalDue>0?Math.min(100,Math.round(collected/totalDue*100)):0;

  function openPay(st){setEditRecId(null);setForm({...blank,studentId:st.id,month,paymentMethod:(settings.paymentMethods||[])[0]||""});setModal(true);}
  function openEditRec(r){setEditRecId(r.id);setForm({studentId:r.studentId,month:r.month,amountPaid:String(r.amountPaid),paidDate:r.paidDate,paymentMethod:r.paymentMethod||"",notes:r.notes||""});setModal(true);}

  async function save(){
    if(!form.studentId||!form.amountPaid)return alert("Student and amount required.");
    const st=students.find(s=>s.id===form.studentId);
    if(st&&!isEligibleForMonth(st,form.month))return alert(`${st.name} joined after ${mLabel(form.month)} and doesn't owe fees for that month.`);
    const due=+(st?.monthlyFee||0);
    const paid=+form.amountPaid;
    const status=due>0&&paid<due?"partial":"paid";
    const rec={...form,status,amountPaid:paid,due,id:editRecId||uid()};
    await onSave(rec);
    setModal(false);
  }

  const hs=students.find(s=>s.id===histId);
  const histRecs=feeRecords.filter(r=>r.studentId===histId).sort((a,b)=>b.month.localeCompare(a.month));

  function handlePrint(){
    const rows=eligibleStudents.map(st=>{const stRecs=mRecs.filter(r=>r.studentId===st.id);const totalPaid=stRecs.reduce((s,r)=>s+(+r.amountPaid||0),0);const due=+(st.monthlyFee||0);const remaining=Math.max(0,due-totalPaid);const isFullyPaid=due>0&&remaining===0;const hasPartial=totalPaid>0&&!isFullyPaid;const status=isFullyPaid?"Paid":hasPartial?"Partial":"Pending";
    return `<tr><td>${st.studentId||"—"}</td><td><b>${st.name}</b></td><td>${fmt(due)}</td><td>${fmt(totalPaid)}</td><td>${fmt(remaining)}</td><td><span class="badge badge-${isFullyPaid?"green":hasPartial?"amber":"red"}">${status}</span></td></tr>`;}).join("");
    printContent(`Fee Collection — ${mLabel(month)}`,`<table><thead><tr><th>ID</th><th>Name</th><th>Due</th><th>Paid</th><th>Remaining</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Monthly Fees" sub="Track all student payments — fees start the month a student joins" action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={()=>{setEditRecId(null);setForm({...blank,month,paymentMethod:(settings.paymentMethods||[])[0]||""});setModal(true);}} color="green">+ Record Payment</Btn></div>}/>
    <Card style={{padding:16,marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div><FL label="Month"/><select value={month} onChange={e=>setMonth(e.target.value)} style={{...IS,width:"auto",fontWeight:700,color:N}}>{monthOpts.map(m=><option key={m} value={m}>{mLabel(m)}</option>)}</select></div>
        <div style={{marginLeft:"auto",display:"flex",gap:16,textAlign:"center"}}>
          <div><div style={{fontSize:18,fontWeight:800,color:GR}}>{fmt(collected)}</div><div style={{fontSize:11,color:"#9ca3af"}}>Collected</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:AM}}>{fmt(Math.max(0,totalDue-collected))}</div><div style={{fontSize:11,color:"#9ca3af"}}>Still Due</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:"#374151"}}>{fmt(totalDue)}</div><div style={{fontSize:11,color:"#9ca3af"}}>Total Due</div></div>
        </div>
      </div>
      {eligibleStudents.length>0&&<><div style={{marginTop:10,height:7,borderRadius:99,background:"#e5e7eb",overflow:"hidden"}}><div style={{height:"100%",borderRadius:99,background:GR,width:`${pct}%`,transition:"width .3s"}}/></div><div style={{fontSize:11,color:"#9ca3af",marginTop:3,textAlign:"right"}}>{pct}% collected</div></>}
    </Card>
    {students.length===0?<Empty icon="💰" msg="Add students first."/>
    :eligibleStudents.length===0?<Empty icon="💰" msg={`No students owe fees for ${mLabel(month)} yet.`}/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {eligibleStudents.map(st=>{const stRecs=mRecs.filter(r=>r.studentId===st.id).sort((a,b)=>b.paidDate.localeCompare(a.paidDate));const totalPaid=stRecs.reduce((s,r)=>s+(+r.amountPaid||0),0);const due=+(st.monthlyFee||0);const remaining=Math.max(0,due-totalPaid);const isFullyPaid=due>0&&remaining===0;const hasPartial=totalPaid>0&&!isFullyPaid;
      return <Card key={st.id} style={{padding:14,borderLeft:`4px solid ${isFullyPaid?"#34d399":hasPartial?"#fbbf24":"#f0f0f0"}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontWeight:800,color:N,fontSize:13}}>{st.name}</span>
              {st.studentId&&<span style={{fontSize:11,color:"#9ca3af"}}>{st.studentId}</span>}
              {isFullyPaid&&<Badge color="green">Paid ✓</Badge>}
              {hasPartial&&<Badge color="amber">Partial</Badge>}
              {!totalPaid&&<Badge color="gray">Pending</Badge>}
            </div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>Fee: {fmt(due)}{remaining>0?` · Remaining: ${fmt(remaining)}`:""}</div>
            {stRecs.length>0&&<div style={{marginTop:5}}>{stRecs.map(r=><div key={r.id} style={{fontSize:11,color:"#6b7280",display:"flex",gap:6,alignItems:"center",marginTop:2,flexWrap:"wrap"}}>
              → Paid {fmt(r.amountPaid)} on {r.paidDate}{r.paymentMethod?` (${r.paymentMethod})`:""}{r.notes?` · ${r.notes}`:""}
              <button onClick={()=>onDelete(r.id)} style={{background:"none",border:"none",color:"#fca5a5",fontSize:14,fontWeight:700,cursor:"pointer"}}>×</button>
              <button onClick={()=>openEditRec(r)} style={{background:"none",border:"none",color:TE,fontSize:11,fontWeight:700,cursor:"pointer"}}>edit</button>
            </div>)}</div>}
          </div>
          {due>0&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontWeight:800,color:isFullyPaid?GR:AM,fontSize:13}}>{fmt(totalPaid)}</div><div style={{fontSize:10,color:"#9ca3af"}}>of {fmt(due)}</div></div>}
        </div>
        <HR/>
        <div style={{display:"flex",gap:14}}>
          <button onClick={()=>openPay(st)} style={{fontSize:12,fontWeight:700,color:GR,background:"none",border:"none",cursor:"pointer"}}>+ Add Payment</button>
          <button onClick={()=>setHistId(st.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>History</button>
        </div>
      </Card>;})}
    </div>}

    {modal&&<Modal title="Record Fee Payment" onClose={()=>setModal(false)}>

function TeacherAttendance({attendance,onSave,onDelete,teachers,settings}){
  const [modal,setModal]=useState(false);const [filterT,setFilterT]=useState("");const [filterM,setFilterM]=useState(thisMonth());
  const blank={teacherId:"",date:today(),status:"present",checkIn:"",notes:""};const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<6;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);

  function getExp(teacherId,date){const t=teachers.find(t=>t.id===teacherId);if(!t||!date)return settings.classStart||"";const day=new Date(date+"T00:00:00").toLocaleDateString("en-US",{weekday:"long"});const sc=t.schedule?.[day];if(sc?.active&&sc.startTime)return sc.startTime;return settings.classStart||"";}
  const expStart=useMemo(()=>getExp(form.teacherId,form.date),[form.teacherId,form.date]);

  async function save(){

  const filtered=[...attendance].filter(a=>(!filterT||a.teacherId===filterT)&&(!filterM||a.date.startsWith(filterM))).sort((a,b)=>b.date.localeCompare(a.date));

  return <div>

    {teachers.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      {teachers.map(t=>{const lates=attendance.filter(a=>a.teacherId===t.id&&(a.isLate||a.status==="late")).length;const absents=attendance.filter(a=>a.teacherId===t.id&&a.status==="absent").length;const total=attendance.filter(a=>a.teacherId===t.id).length;
      return <Card key={t.id} style={{padding:12}}>

        <div style={{display:"flex",gap:10}}>
          <div><div style={{fontSize:18,fontWeight:800,color:AM}}>{lates}</div><div style={{fontSize:10,color:"#9ca3af"}}>Late</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:RE}}>{absents}</div><div style={{fontSize:10,color:"#9ca3af"}}>Absent</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:"#9ca3af"}}>{total}</div><div style={{fontSize:10,color:"#9ca3af"}}>Days</div></div>
        </div>
      </Card>;})}
    </div>}

    <div style={{display:"flex",gap:8,marginBottom:14}}>

      {form.status!=="absent"&&form.checkIn&&<div style={{borderRadius:10,padding:"8px 12px",fontSize:13,fontWeight:700,marginBottom:12,background:isLate(form.checkIn,expStart)?"#fef2f2":"#f0fdf4",color:isLate(form.checkIn,expStart)?RE:GR}}>{isLate(form.checkIn,expStart)?`⚠️ Late (expected ${expStart})`:`✅ On time (expected ${expStart})`}</div>}

const GRADE_BOUNDARIES=[{grade:"A+",min:90},{grade:"A",min:80},{grade:"B+",min:70},{grade:"B",min:60},{grade:"C",min:50},{grade:"D",min:40},{grade:"F",min:0}];
function autoGrade(score,total){if(!score||!total||+total===0)return"";const pct=(+score/+total)*100;for(const b of GRADE_BOUNDARIES){if(pct>=b.min)return b.grade;}return"F";}

function Results({results,onSave,onDelete,students,teachers,settings}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);const [viewStudentId,setViewStudentId]=useState("");const [filterSubject,setFilterSubject]=useState("");const [filterCourse,setFilterCourse]=useState("");

  const filtered=results.filter(r=>{const st=students.find(s=>s.id===r.studentId);const matchStudent=!viewStudentId||r.studentId===viewStudentId;const matchSubject=!filterSubject||r.subject===filterSubject;const matchCourse=!filterCourse||(st?.course||"")===filterCourse;return matchStudent&&matchSubject&&matchCourse;}).sort((a,b)=>b.date.localeCompare(a.date));

  async function save(){
    if(!form.studentId)return alert("Select a student.");
    if(!form.examName.trim())return alert("Exam name required.");

    if(!form.totalMarks||!form.score)return alert("Total marks and score required.");
    if(+form.score>+form.totalMarks)return alert("Score cannot exceed total marks.");
    const grade=form.grade||autoGrade(form.score,form.totalMarks);

  return <div>
    <SHdr title="Exam Results" action={<div style={{display:"flex",gap:8}}><Btn onClick={()=>{const rows=filtered.map(r=>{const st=students.find(s=>s.id===r.studentId);const t=teachers.find(t=>t.id===r.teacherId);const pct=r.totalMarks?(((r.score||0)/r.totalMarks)*100).toFixed(1)+"%":"—";return `<tr><td>${r.date}</td><td><b>${st?.name||"—"}</b></td><td>${r.examName}</td><td>${r.subject||"—"}</td><td>${t?.name||"—"}</td><td>${r.score}/${r.totalMarks} (${pct})</td><td><span class="badge badge-${r.grade==="A+"||r.grade==="A"?"green":r.grade==="F"?"red":"amber"}">${r.grade||"—"}</span></td></tr>`;}).join("");printContent("Exam Results",`<table><thead><tr><th>Date</th><th>Student</th><th>Exam</th><th>Subject</th><th>Teacher</th><th>Score</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table>`);}} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={()=>{setEditId(null);setForm({...blank});setModal(true);}} color="purple">+ Add Result</Btn></div>}/>
    <Card style={{padding:14,marginBottom:14}}>

        <select value={filterCourse} onChange={e=>setFilterCourse(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Courses</option>{allCourses.map(c=><option key={c} value={c}>{c}</option>)}</select>
        <select value={filterSubject} onChange={e=>setFilterSubject(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Subjects</option>{(settings.subjects||[]).map(s=><option key={s} value={s}>{s}</option>)}</select>
      </div>
      {(viewStudentId||filterCourse||filterSubject)&&<button onClick={()=>{setViewStudentId("");setFilterCourse("");setFilterSubject("");}} style={{fontSize:11,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",marginTop:8}}>✕ Clear</button>}
    </Card>
    {filtered.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
      <StatCard label="Results" value={filtered.length} icon="📋" from={PU} to="#6d28d9"/>

      return <Card key={r.id} style={{padding:14,borderLeft:`4px solid ${r.grade==="A+"||r.grade==="A"?GR:r.grade==="F"?RE:r.grade==="B+"||r.grade==="B"?TE:AM}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:3}}>
              <span style={{fontWeight:800,color:N,fontSize:13}}>{st?.name||"Unknown"}</span>
              {st?.course&&<Badge color="purple">{st.course}</Badge>}
            </div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:3}}><Badge color="purple">{r.examName}</Badge>{r.examType&&<Badge color="gray">{r.examType}</Badge>}{r.subject&&<Badge color="blue">{r.subject}</Badge>}{t&&<span style={{fontSize:11,color:"#6b7280"}}>· {t.name}</span>}</div>
            <div style={{fontSize:11,color:"#9ca3af"}}>{r.date}{r.notes?` · ${r.notes}`:""}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontWeight:800,color:N,fontSize:16}}>{r.score}<span style={{fontSize:11,fontWeight:600,color:"#9ca3af"}}>/{r.totalMarks}</span></div>
            <div style={{fontSize:11,color:"#9ca3af"}}>{pct}%</div>
            {r.grade&&<div style={{marginTop:3}}><Badge color={r.grade==="A+"||r.grade==="A"?"green":r.grade==="F"?"red":r.grade==="B+"||r.grade==="B"?"teal":"amber"}>{r.grade}</Badge></div>}

        <div style={{display:"flex",gap:14}}><button onClick={()=>{setEditId(r.id);setForm({...r});setModal(true);}} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button><button onClick={()=>onDelete(r.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button></div>
      </Card>;})}
    </div>}
    {modal&&<Modal title={editId?"Edit Result":"Add Result"} onClose={()=>setModal(false)} wide>

        <FSel label="Subject" req options={settings.subjects||[]} value={form.subject} onChange={e=>sf("subject",e.target.value)}/>
        <FSel label="Teacher" options={teachers.map(t=>({value:t.id,label:t.name}))} value={form.teacherId} onChange={e=>sf("teacherId",e.target.value)}/>

        <FI label="Score" req type="number" value={form.score} onChange={e=>{sf("score",e.target.value);sf("grade",autoGrade(e.target.value,form.totalMarks));}}/>
        <FI label="Date" req type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
        <div style={{marginBottom:14}}>
          <FL label="Grade"/><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{GRADE_BOUNDARIES.map(b=><button key={b.grade} type="button" onClick={()=>sf("grade",b.grade)} style={{padding:"5px 10px",borderRadius:7,border:`1.5px solid ${form.grade===b.grade?N:"#e5e7eb"}`,background:form.grade===b.grade?N:"#fff",color:form.grade===b.grade?"#fff":"#6b7280",fontSize:12,fontWeight:700}}>{b.grade}</button>)}</div>

function SideIncome({sideIncome,onSave,onDelete,students,settings}){

  const blank={type:"",lineItems:[{id:uid(),subject:"",category:"",amount:""}],studentId:"",date:today(),paymentMethod:"",notes:""};
  const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<18;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);
  const filtered=[...sideIncome].filter(r=>!filterM||r.date?.startsWith(filterM)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const total=filtered.reduce((s,r)=>s+(+r.totalAmount||0),0);
  const mTotal=sideIncome.filter(r=>r.date?.startsWith(thisMonth())).reduce((s,r)=>s+(+r.totalAmount||0),0);
  const FEE_CATS=["Admission Fee","Lab Fee","Book Fee","Mock Test Fee","Registration Fee","Exam Fee","Material Fee","Other"];

  function addLine(){sf("lineItems",[...form.lineItems,{id:uid(),subject:"",category:"",amount:""}]);}
  function removeLine(id){if(form.lineItems.length===1)return;sf("lineItems",form.lineItems.filter(l=>l.id!==id));}
  function updateLine(id,k,v){sf("lineItems",form.lineItems.map(l=>l.id===id?{...l,[k]:v}:l));}

  async function save(){
    if(!form.type)return alert("Type required.");
    const lineItems=form.lineItems.filter(l=>l.amount);
    if(!lineItems.length)return alert("Add at least one item.");
    const totalAmount=lineItems.reduce((s,l)=>s+(+l.amount||0),0);
    await onSave({...form,lineItems,totalAmount,id:editId||uid()});
    setModal(false);

// ── EXPENSES ──────────────────────────────────────────────────────

        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>

        </div>

      <FI label="Event Name" req value={form.name} onChange={e=>sf("name",e.target.value)}/>

        {!(ve.studentPayments||[]).length?<p style={{fontSize:12,color:"#9ca3af"}}>No payments yet.</p>
        :<div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden"}}>{ve.studentPayments.map((p,i)=>{const st=students.find(s=>s.id===p.studentId);return <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<ve.studentPayments.length-1?"1px solid #f5f5f5":"none"}}>
          <div><span style={{fontWeight:600,fontSize:12}}>{st?.name||"Unknown"}</span>{p.notes&&<span style={{fontSize:11,color:"#9ca3af",marginLeft:6}}>· {p.notes}</span>}</div>

        </div>;})}
