<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ARDENT Education — Admin Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f0f2f8;color:#1f2937;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
input,select,textarea,button{font-family:'DM Sans',sans-serif;}
button{cursor:pointer;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .22s ease-out;}
.sidebar{position:fixed;top:0;left:0;height:100%;z-index:40;transition:transform .3s ease;transform:translateX(-100%);}
.sidebar.open{transform:translateX(0);}
@media(min-width:1024px){.sidebar{position:sticky;transform:translateX(0)!important;top:0;height:100vh;}.mobile-header{display:none!important;}.app-layout{flex-direction:row;}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:35;}
.overlay.show{display:block;}
@media print{
  .sidebar,.mobile-header,.no-print{display:none!important;}
  .print-area{display:block!important;}
  body{background:#fff;}
  .app-layout{display:block;}
  main{padding:0!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useRef} = React;

// ── Storage ───────────────────────────────────────────────────────
function dbGet(key,fb=null){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fb;}catch{return fb;}}
function dbSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

// ── Constants ─────────────────────────────────────────────────────
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];
const DAYS_S=["Sat","Sun","Mon","Tue","Wed","Thu","Fri"];
const today=()=>new Date().toISOString().split("T")[0];
const nowTime=()=>new Date().toTimeString().slice(0,5);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const mLabel=(ym)=>{if(!ym)return"";const[y,m]=ym.split("-");return`${MONTHS[+m-1]} ${y}`;};
const uid=()=>`${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
const isLate=(ci,cs)=>!!ci&&!!cs&&ci>cs;
const fmt=(n)=>`৳${(+n||0).toLocaleString()}`;
const blankSched=()=>{const s={};DAYS.forEach(d=>{s[d]={active:false,startTime:""}});return s;};

// ── Colours ───────────────────────────────────────────────────────
const N="#0c1445",AM="#f59e0b",GR="#059669",RE="#ef4444",TE="#0d9488",PU="#7c3aed";

// ── UI Primitives ─────────────────────────────────────────────────
const Badge=({children,color="blue"})=>{
  const m={blue:["#eff6ff","#1d4ed8","#bfdbfe"],green:["#f0fdf4","#059669","#a7f3d0"],red:["#fef2f2","#dc2626","#fecaca"],amber:["#fffbeb","#d97706","#fde68a"],navy:["#eef2ff","#0c1445","#c7d2fe"],gray:["#f9fafb","#4b5563","#e5e7eb"],teal:["#f0fdfa","#0d9488","#99f6e4"],purple:["#faf5ff","#7c3aed","#ddd6fe"],pink:["#fdf2f8","#9d174d","#fbcfe8"]};
  const[bg,fc,bc]=m[color]||m.blue;
  return <span style={{background:bg,color:fc,border:`1px solid ${bc}`,padding:"2px 10px",borderRadius:999,fontSize:11,fontWeight:700,display:"inline-block",whiteSpace:"nowrap"}}>{children}</span>;
};

const Modal=({title,onClose,children,wide=false})=>{
  useEffect(()=>{document.body.style.overflow="hidden";return()=>{document.body.style.overflow="";};},[]);
  return <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"16px",background:"rgba(0,0,0,0.6)",overflowY:"auto"}}>
    <div className="fade-in" style={{background:"#fff",borderRadius:20,boxShadow:"0 25px 60px rgba(0,0,0,0.25)",width:"100%",maxWidth:wide?720:480,margin:"auto",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 24px",borderBottom:"1px solid #f0f0f0",position:"sticky",top:0,background:"#fff",borderRadius:"20px 20px 0 0",zIndex:1}}>
        <span style={{fontWeight:800,color:N,fontSize:16}}>{title}</span>
        <button onClick={onClose} style={{width:32,height:32,borderRadius:"50%",background:"#f3f4f6",border:"none",fontSize:18,fontWeight:700,color:"#9ca3af",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
      </div>
      <div style={{padding:"20px 24px"}}>{children}</div>
    </div>
  </div>;
};

const IS={width:"100%",border:"1.5px solid #e5e7eb",borderRadius:10,padding:"9px 13px",fontSize:13,background:"#f9fafb",color:"#1f2937",outline:"none",transition:"border .2s,box-shadow .2s"};
const focusIn=e=>{e.target.style.borderColor="#fbbf24";e.target.style.boxShadow="0 0 0 3px rgba(251,191,36,.15)";};
const focusOut=e=>{e.target.style.borderColor="#e5e7eb";e.target.style.boxShadow="none";};
const FL=({label,req})=><label style={{display:"block",fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>{label}{req&&<span style={{color:"#f87171",marginLeft:2}}>*</span>}</label>;
const FI=({label,req,...p})=><div style={{marginBottom:14}}><FL label={label} req={req}/><input style={IS} onFocus={focusIn} onBlur={focusOut} {...p}/></div>;
const FTA=({label,rows=2,...p})=><div style={{marginBottom:14}}><FL label={label}/><textarea rows={rows} style={{...IS,resize:"vertical"}} onFocus={focusIn} onBlur={focusOut} {...p}/></div>;
const FSel=({label,options,req,...p})=><div style={{marginBottom:14}}><FL label={label} req={req}/><select style={IS} onFocus={focusIn} onBlur={focusOut} {...p}><option value="">— Select —</option>{(options||[]).map(o=><option key={o.value??o} value={o.value??o}>{o.label??o}</option>)}</select></div>;
const FM=({label,options,selected,onChange,req})=><div style={{marginBottom:14}}><FL label={label} req={req}/>
  {!(options||[]).length
    ?<p style={{fontSize:12,color:"#d97706",background:"#fffbeb",borderRadius:8,padding:"8px 12px"}}>⚙️ Add subjects in Settings first.</p>
    :<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{(options||[]).map(o=><button type="button" key={o} onClick={()=>onChange((selected||[]).includes(o)?(selected||[]).filter(s=>s!==o):[...(selected||[]),o])} style={{padding:"5px 11px",borderRadius:7,border:`1.5px solid ${(selected||[]).includes(o)?N:"#e5e7eb"}`,background:(selected||[]).includes(o)?N:"#fff",color:(selected||[]).includes(o)?"#fff":"#6b7280",fontSize:12,fontWeight:700}}>{o}</button>)}</div>}
</div>;
const BS={navy:{background:N,color:"#fff"},amber:{background:AM,color:"#fff"},green:{background:GR,color:"#fff"},red:{background:RE,color:"#fff"},ghost:{background:"#f3f4f6",color:"#374151"},teal:{background:TE,color:"#fff"},purple:{background:PU,color:"#fff"}};
const Btn=({children,onClick,color="navy",style={},disabled=false,full=false,type="button"})=><button type={type} onClick={onClick} disabled={disabled} style={{padding:"9px 16px",borderRadius:10,border:"none",fontSize:13,fontWeight:700,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,width:full?"100%":"auto",...(BS[color]||BS.navy),...style}}>{children}</button>;
const Card=({children,style={}})=><div style={{background:"#fff",borderRadius:16,border:"1px solid #eff0f6",boxShadow:"0 2px 8px rgba(12,20,69,.05)",...style}}>{children}</div>;
const Empty=({icon,msg})=><div style={{textAlign:"center",padding:"48px 0",color:"#9ca3af"}}><div style={{fontSize:44,marginBottom:10}}>{icon}</div><p style={{fontSize:13}}>{msg}</p></div>;
const HR=()=><div style={{borderBottom:"1px solid #f5f5f5",margin:"10px 0"}}/>;
const SHdr=({title,sub,action})=><div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:20,gap:10,flexWrap:"wrap"}}><div><h2 style={{fontWeight:800,color:N,fontSize:22,margin:0}}>{title}</h2>{sub&&<p style={{color:"#9ca3af",fontSize:12,marginTop:2}}>{sub}</p>}</div>{action}</div>;
const InfoBox=({children,color="amber"})=>{const s={amber:{background:"#fffbeb",border:"1px solid #fde68a",color:"#92400e"},red:{background:"#fef2f2",border:"1px solid #fecaca",color:"#991b1b"},green:{background:"#f0fdf4",border:"1px solid #a7f3d0",color:"#065f46"}};return <div style={{borderRadius:12,padding:14,marginBottom:16,fontSize:13,fontWeight:600,...(s[color]||s.amber)}}>{children}</div>;};
const StatCard=({label,value,icon,from,to})=><div style={{background:`linear-gradient(135deg,${from},${to})`,borderRadius:14,padding:14,color:"#fff"}}>
  <div style={{fontSize:22,marginBottom:4}}>{icon}</div>
  <div style={{fontSize:20,fontWeight:800,lineHeight:1}}>{value}</div>
  <div style={{fontSize:11,opacity:.75,marginTop:3,lineHeight:1.3}}>{label}</div>
</div>;

// ── Weekly Schedule Editor ────────────────────────────────────────
function WeeklyScheduleEditor({schedule,onChange}){
  const s=schedule||blankSched();
  return <div style={{marginBottom:14}}>
    <FL label="Weekly Class Schedule" req/>
    <div style={{border:"1.5px solid #e5e7eb",borderRadius:12,overflow:"hidden"}}>
      {DAYS.map((day,i)=>{
        const info=s[day]||{active:false,startTime:""};
        return <div key={day} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",borderBottom:i<6?"1px solid #f3f4f6":"none",background:info.active?"#f0fdf4":"#fafafa"}}>
          <button type="button" onClick={()=>onChange({...s,[day]:{...info,active:!info.active,startTime:info.active?"":info.startTime}})} style={{width:36,height:20,borderRadius:10,background:info.active?"#059669":"#d1d5db",border:"none",cursor:"pointer",position:"relative",flexShrink:0}}>
            <span style={{position:"absolute",top:2,width:16,height:16,borderRadius:"50%",background:"#fff",boxShadow:"0 1px 3px rgba(0,0,0,.2)",left:info.active?18:2,transition:"left .15s"}}/>
          </button>
          <span style={{fontWeight:700,fontSize:12,width:88,color:info.active?"#065f46":"#d1d5db"}}>{day}</span>
          {info.active
            ? <input type="time" value={info.startTime} onChange={e=>onChange({...s,[day]:{...info,startTime:e.target.value}})} style={{border:"1.5px solid #a7f3d0",borderRadius:7,padding:"3px 8px",fontSize:12,fontWeight:700,color:"#065f46",background:"#fff",outline:"none"}}/>
            : <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:999,background:"#f3f4f6",color:"#d1d5db"}}>No Class</span>}
          {info.active&&!info.startTime&&<span style={{fontSize:11,color:AM,fontWeight:600}}>⚠ Set time</span>}
        </div>;
      })}
    </div>
    <p style={{fontSize:11,color:"#9ca3af",marginTop:4}}>Toggle ON to set start time. OFF = no class that day.</p>
  </div>;
}

// ── Subject-Fees Editor (per student) ────────────────────────────
function SubjectFeeEditor({assignments,onChange,teachers,subjects}){
  const [tId,setTId]=useState("");
  const [subj,setSubj]=useState("");
  const [fee,setFee]=useState("");
  const avail=useMemo(()=>{if(!tId)return subjects||[];const t=teachers.find(t=>t.id===tId);return(t?.subjects||[]).length?t.subjects:subjects||[];},[tId,teachers,subjects]);
  function add(){
    if(!tId||!subj)return alert("Select teacher and subject.");
    if(!fee||isNaN(+fee)||+fee<0)return alert("Enter a valid fee amount for this subject.");
    if((assignments||[]).find(a=>a.teacherId===tId&&a.subject===subj))return alert("Already assigned.");
    onChange([...(assignments||[]),{id:uid(),teacherId:tId,subject:subj,subjectFee:+fee}]);
    setTId("");setSubj("");setFee("");
  }
  return <div style={{marginBottom:14}}>
    <FL label="Subject → Teacher → Fee per Subject" req/>
    <div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden",marginBottom:8}}>
      {!(assignments||[]).length
        ?<p style={{fontSize:12,color:"#9ca3af",padding:"10px 14px"}}>No assignments yet. Add at least one.</p>
        :(assignments||[]).map(a=>{const t=teachers.find(t=>t.id===a.teacherId);return <div key={a.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 14px",borderBottom:"1px solid #f5f5f5",flexWrap:"wrap",gap:4}}>
            <span style={{fontSize:12,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}><Badge color="blue">{a.subject}</Badge><span style={{color:"#6b7280"}}>→ {t?.name||"—"}</span><Badge color="green">{fmt(a.subjectFee)}</Badge></span>
            <button onClick={()=>onChange((assignments||[]).filter(x=>x.id!==a.id))} style={{background:"none",border:"none",color:"#fca5a5",fontSize:18,fontWeight:700,cursor:"pointer"}}>&times;</button>
          </div>;})}
    </div>
    {teachers.length===0?<p style={{fontSize:12,color:"#d97706",background:"#fffbeb",borderRadius:8,padding:"8px 12px"}}>Add teachers first.</p>
    :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <select value={tId} onChange={e=>{setTId(e.target.value);setSubj("");}} style={{...IS,flex:1,minWidth:110,fontSize:12}}><option value="">Select Teacher</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
      <select value={subj} onChange={e=>setSubj(e.target.value)} style={{...IS,flex:1,minWidth:100,fontSize:12}}><option value="">Select Subject</option>{avail.map(s=><option key={s} value={s}>{s}</option>)}</select>
      <input type="number" value={fee} onChange={e=>setFee(e.target.value)} placeholder="Fee ৳" style={{...IS,flex:1,minWidth:80,fontSize:12}} onFocus={focusIn} onBlur={focusOut}/>
      <Btn onClick={add} color="teal" style={{padding:"8px 12px",fontSize:12}}>+ Add</Btn>
    </div>}
  </div>;
}

// ── Print Helper ──────────────────────────────────────────────────
function printContent(title, htmlContent) {
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>${title} — ARDENT Education</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;color:#1f2937;padding:24px;background:#fff;}
    .print-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0c1445;padding-bottom:14px;margin-bottom:20px;}
    .print-header h1{font-family:'Playfair Display',serif;font-size:26px;color:#0c1445;}
    .print-header .sub{font-size:12px;color:#6b7280;margin-top:3px;}
    .print-header .meta{text-align:right;font-size:11px;color:#6b7280;}
    table{width:100%;border-collapse:collapse;margin-bottom:16px;}
    th{background:#0c1445;color:#fff;padding:8px 10px;font-size:11px;text-align:left;font-weight:700;letter-spacing:.04em;}
    td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f0f0f0;}
    tr:nth-child(even) td{background:#f9fafb;}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;}
    .badge-green{background:#d1fae5;color:#065f46;}
    .badge-red{background:#fee2e2;color:#991b1b;}
    .badge-amber{background:#fef3c7;color:#92400e;}
    .badge-blue{background:#dbeafe;color:#1d4ed8;}
    .badge-gray{background:#f3f4f6;color:#374151;}
    .card{background:#f9fafb;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;}
    .card h3{font-size:14px;font-weight:800;color:#0c1445;margin-bottom:6px;}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .detail-item{background:#fff;border-radius:8px;padding:8px;border:1px solid #e5e7eb;}
    .detail-item .lbl{font-size:9px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;}
    .detail-item .val{font-size:13px;font-weight:700;color:#1f2937;margin-top:2px;}
    .footer{margin-top:24px;border-top:1px solid #e5e7eb;padding-top:10px;font-size:10px;color:#9ca3af;display:flex;justify-content:space-between;}
    h2{font-size:16px;font-weight:800;color:#0c1445;margin-bottom:10px;margin-top:16px;}
    @media print{body{padding:10px;}}
  </style></head><body>
  <div class="print-header">
    <div><h1>ARDENT Education</h1><div class="sub">${title}</div></div>
    <div class="meta">Printed: ${new Date().toLocaleString('en-BD')}</div>
  </div>
  ${htmlContent}
  <div class="footer"><span>ARDENT Education Admin Portal</span><span>Page 1</span></div>
  </body></html>`);
  win.document.close();
  setTimeout(()=>{win.print();},600);
}

// ── SETTINGS ─────────────────────────────────────────────────────
function Settings({settings,setSettings}){
  const [form,setForm]=useState({classStart:"",subjects:[],paymentMethods:[],expenseCategories:[],centreName:"",contactNo:"",address:"",...settings});
  const [nSub,setNSub]=useState("");
  const [nPay,setNPay]=useState("");
  const [nCat,setNCat]=useState("");

  // sync when settings prop changes
  useEffect(()=>{
    setForm(prev=>({classStart:"",subjects:[],paymentMethods:[],expenseCategories:[],centreName:"",contactNo:"",address:"",...settings}));
  },[settings]);

  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  function save(){
    if(!form.classStart)return alert("Class start time is required.");
    setSettings(form);
    alert("✅ Settings saved!");
  }

  function addItem(key,val,setV){
    const v=val.trim();
    if(!v)return;
    if((form[key]||[]).some(x=>x.toLowerCase()===v.toLowerCase()))return alert("Already exists.");
    sf(key,[...(form[key]||[]),v]);
    setV("");
  }

  function removeItem(key,v){sf(key,(form[key]||[]).filter(x=>x!==v));}

  const ChipRow=({k,col="#eef2ff",tc=N,bc="#c7d2fe"})=>
    !(form[k]||[]).length
      ?<p style={{fontSize:12,color:"#9ca3af",textAlign:"center",padding:"8px 0"}}>None yet.</p>
      :<div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {(form[k]||[]).map(v=><span key={v} style={{display:"flex",alignItems:"center",gap:5,background:col,color:tc,border:`1px solid ${bc}`,borderRadius:7,padding:"4px 10px",fontSize:12,fontWeight:700}}>
          {v}
          <button onClick={()=>removeItem(k,v)} style={{background:"none",border:"none",color:RE,fontWeight:700,fontSize:14,cursor:"pointer",lineHeight:1}}>×</button>
        </span>)}
      </div>;

  const AddRow=({val,setV,onAdd,ph,btnC="amber"})=><div style={{display:"flex",gap:8,marginBottom:10}}>
    <input value={val} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==="Enter"&&onAdd()} placeholder={ph} style={{...IS,flex:1,fontSize:12}} onFocus={focusIn} onBlur={focusOut}/>
    <Btn onClick={onAdd} color={btnC} style={{padding:"8px 14px",fontSize:12}}>Add</Btn>
  </div>;

  return <div>
    <SHdr title="Settings" sub="Configure everything before adding data"/>
    {!settings.classStart&&<InfoBox>⚠️ <b>First-time setup:</b> Set admin check-in cutoff time and add subjects before adding data.</InfoBox>}
    <Card style={{padding:18,marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:700,color:AM,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}}>⏰ Admin Attendance Cutoff</p>
      <FI label="Admin Must Check-In By (Late after this time)" req type="time" value={form.classStart||""} onChange={e=>sf("classStart",e.target.value)}/>
      <p style={{fontSize:11,color:"#9ca3af",marginTop:-8}}>Admin must check in within 10 minutes of class start. Missing check-in = Absent next day.</p>
    </Card>
    <Card style={{padding:18,marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:700,color:N,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}}>🏫 Coaching Info</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <FI label="Centre Name" value={form.centreName||""} onChange={e=>sf("centreName",e.target.value)} placeholder="ARDENT Education"/>
        <FI label="Contact" value={form.contactNo||""} onChange={e=>sf("contactNo",e.target.value)}/>
      </div>
      <FI label="Address" value={form.address||""} onChange={e=>sf("address",e.target.value)}/>
    </Card>
    <Card style={{padding:18,marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:700,color:N,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>📚 Subjects</p>
      <AddRow val={nSub} setV={setNSub} onAdd={()=>addItem("subjects",nSub,setNSub)} ph="Type subject and press Add or Enter…"/>
      <ChipRow k="subjects"/>
    </Card>
    <Card style={{padding:18,marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:700,color:N,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>💳 Payment Methods</p>
      <AddRow val={nPay} setV={setNPay} onAdd={()=>addItem("paymentMethods",nPay,setNPay)} ph="e.g. Cash, bKash, Nagad…" btnC="teal"/>
      <ChipRow k="paymentMethods" col="#f0fdf4" tc="#065f46" bc="#a7f3d0"/>
    </Card>
    <Card style={{padding:18,marginBottom:18}}>
      <p style={{fontSize:11,fontWeight:700,color:N,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>🏷️ Expense Categories</p>
      <AddRow val={nCat} setV={setNCat} onAdd={()=>addItem("expenseCategories",nCat,setNCat)} ph="e.g. Rent, Utilities, Printing…" btnC="red"/>
      <ChipRow k="expenseCategories" col="#fef2f2" tc="#991b1b" bc="#fecaca"/>
    </Card>
    <Btn onClick={save} full>💾 Save Settings</Btn>
  </div>;
}

// ── ADMIN ATTENDANCE (replaces Dashboard) ─────────────────────────
function AdminAttendance({adminAttendance,setAdminAttendance,settings}){
  const CUTOFF=settings.classStart||"11:30"; // 11:30am default
  const LATE_WINDOW=10; // minutes
  const [checkingIn,setCheckingIn]=useState(false);
  const [editModal,setEditModal]=useState(null); // date string for yesterday edit

  const todayStr=today();
  const todayRec=adminAttendance.find(r=>r.date===todayStr);

  // Check yesterday's record — allow editing
  const yest=new Date();yest.setDate(yest.getDate()-1);
  const yestStr=yest.toISOString().split("T")[0];
  const yestRec=adminAttendance.find(r=>r.date===yestStr);

  function calcStatus(checkIn){
    if(!checkIn)return"absent";
    const [ch,cm]=checkIn.split(":").map(Number);
    const [cuth,cutm]=CUTOFF.split(":").map(Number);
    const late=(ch*60+cm)-(cuth*60+cutm);
    if(late>LATE_WINDOW)return"late";
    return"present";
  }

  function doCheckIn(){
    const t=nowTime();
    const status=calcStatus(t);
    const rec={id:uid(),date:todayStr,checkIn:t,status,cutoff:CUTOFF};
    setAdminAttendance(p=>[...p.filter(r=>r.date!==todayStr),rec]);
    setCheckingIn(false);
  }

  function saveYestEdit(checkIn,absent){
    if(absent){
      const rec={id:uid(),date:yestStr,checkIn:"",status:"absent",cutoff:CUTOFF,manualEdit:true};
      setAdminAttendance(p=>[...p.filter(r=>r.date!==yestStr),rec]);
    } else {
      if(!checkIn)return alert("Enter check-in time.");
      const status=calcStatus(checkIn);
      const rec={id:uid(),date:yestStr,checkIn,status,cutoff:CUTOFF,manualEdit:true};
      setAdminAttendance(p=>[...p.filter(r=>r.date!==yestStr),rec]);
    }
    setEditModal(null);
  }

  const monthRecs=[...adminAttendance].filter(r=>r.date.startsWith(thisMonth())).sort((a,b)=>b.date.localeCompare(a.date));
  const lates=adminAttendance.filter(r=>r.status==="late").length;
  const absents=adminAttendance.filter(r=>r.status==="absent").length;
  const total=adminAttendance.length;

  const SC={present:["#f0fdf4","#059669","#d1fae5"],late:["#fffbeb","#d97706","#fde68a"],absent:["#fef2f2","#dc2626","#fecaca"]};

  // Print attendance
  function handlePrint(){
    const rows=adminAttendance.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`
      <tr>
        <td>${r.date}</td>
        <td>${r.checkIn||"—"}</td>
        <td><span class="badge badge-${r.status==="present"?"green":r.status==="late"?"amber":"red"}">${r.status.charAt(0).toUpperCase()+r.status.slice(1)}</span></td>
        <td>${r.cutoff||CUTOFF}</td>
        <td>${r.manualEdit?"(Edited)":""}</td>
      </tr>`).join("");
    printContent("Admin Attendance Log",`
      <div class="detail-grid" style="margin-bottom:16px;">
        <div class="detail-item"><div class="lbl">Total Days</div><div class="val">${total}</div></div>
        <div class="detail-item"><div class="lbl">Late</div><div class="val">${lates}</div></div>
        <div class="detail-item"><div class="lbl">Absent</div><div class="val">${absents}</div></div>
        <div class="detail-item"><div class="lbl">On Time</div><div class="val">${total-lates-absents}</div></div>
      </div>
      <table><thead><tr><th>Date</th><th>Check-In</th><th>Status</th><th>Cutoff</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Admin Attendance" sub="Your personal daily check-in — cannot be falsified" action={<Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn>}/>

    {/* Today's check-in card */}
    <Card style={{padding:22,marginBottom:16,borderLeft:`4px solid ${todayRec?SC[todayRec.status]?.[1]:N}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Today — {todayStr}</div>
          {todayRec
            ?<>
              <div style={{fontSize:26,fontWeight:800,color:SC[todayRec.status]?.[1]}}>{todayRec.status.charAt(0).toUpperCase()+todayRec.status.slice(1)}</div>
              <div style={{fontSize:13,color:"#6b7280",marginTop:4}}>Checked in at <b>{todayRec.checkIn||"—"}</b> (cutoff: {CUTOFF})</div>
            </>
            :<>
              <div style={{fontSize:20,fontWeight:800,color:"#9ca3af"}}>Not Checked In</div>
              <div style={{fontSize:12,color:"#9ca3af",marginTop:3}}>Cutoff: <b>{CUTOFF}</b> (+{LATE_WINDOW} min grace)</div>
            </>}
        </div>
        {!todayRec&&<Btn onClick={doCheckIn} color="green" style={{padding:"11px 22px",fontSize:14}}>✅ Check In Now</Btn>}
        {todayRec&&<div style={{background:SC[todayRec.status]?.[0],border:`1px solid ${SC[todayRec.status]?.[2]}`,borderRadius:12,padding:"8px 16px",textAlign:"center"}}>
          <div style={{fontSize:22}}>{todayRec.status==="present"?"✅":todayRec.status==="late"?"⚠️":"❌"}</div>
          <div style={{fontSize:10,fontWeight:700,color:SC[todayRec.status]?.[1],textTransform:"uppercase"}}>Recorded</div>
        </div>}
      </div>
    </Card>

    {/* Yesterday edit (editable only for next day) */}
    <Card style={{padding:16,marginBottom:16,border:"1.5px dashed #e5e7eb"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontWeight:700,fontSize:13,color:N}}>Yesterday ({yestStr})</div>
          {yestRec
            ?<div style={{fontSize:12,color:"#6b7280",marginTop:2}}>Status: <b>{yestRec.status}</b> · Check-in: {yestRec.checkIn||"Absent"}</div>
            :<div style={{fontSize:12,color:RE,marginTop:2}}>No record — add yesterday's attendance</div>}
        </div>
        <Btn onClick={()=>setEditModal({date:yestStr,rec:yestRec})} color="amber" style={{fontSize:12,padding:"7px 13px"}}>
          {yestRec?"Edit Yesterday":"Add Yesterday"}
        </Btn>
      </div>
    </Card>

    {/* Stats */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
      <StatCard label="On Time" value={total-lates-absents} icon="✅" from={GR} to="#047857"/>
      <StatCard label="Late Days" value={lates} icon="⚠️" from={AM} to="#b45309"/>
      <StatCard label="Absent" value={absents} icon="❌" from={RE} to="#b91c1c"/>
    </div>

    {/* History */}
    <Card style={{padding:14}}>
      <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Attendance History</p>
      {monthRecs.length===0?<Empty icon="📅" msg="No records this month."/>
      :<div style={{display:"flex",flexDirection:"column",gap:6}}>
        {monthRecs.map(r=>{const[bg,fc,bc]=SC[r.status]||SC.absent;return <div key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:bg,border:`1px solid ${bc}`,borderRadius:10}}>
          <div><div style={{fontWeight:700,fontSize:12,color:fc}}>{r.date}{r.manualEdit?" ✏️":""}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:1}}>Check-in: {r.checkIn||"—"}</div></div>
          <Badge color={r.status==="present"?"green":r.status==="late"?"amber":"red"}>{r.status.charAt(0).toUpperCase()+r.status.slice(1)}</Badge>
        </div>;})}
      </div>}
    </Card>

    {editModal&&<Modal title={`Edit Attendance — ${editModal.date}`} onClose={()=>setEditModal(null)}>
      <YesterdayEditForm rec={editModal.rec} onSave={saveYestEdit} onClose={()=>setEditModal(null)}/>
    </Modal>}
  </div>;
}

function YesterdayEditForm({rec,onSave,onClose}){
  const [absent,setAbsent]=useState(rec?.status==="absent"||false);
  const [checkIn,setCheckIn]=useState(rec?.checkIn||"");
  return <div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setAbsent(false)} style={{flex:1,padding:"9px",borderRadius:10,border:`2px solid ${!absent?GR:"#e5e7eb"}`,background:!absent?"#f0fdf4":"#fff",color:!absent?GR:"#6b7280",fontWeight:700,fontSize:13,cursor:"pointer"}}>Present / Late</button>
      <button onClick={()=>setAbsent(true)} style={{flex:1,padding:"9px",borderRadius:10,border:`2px solid ${absent?RE:"#e5e7eb"}`,background:absent?"#fef2f2":"#fff",color:absent?RE:"#6b7280",fontWeight:700,fontSize:13,cursor:"pointer"}}>Absent</button>
    </div>
    {!absent&&<FI label="Check-In Time" req type="time" value={checkIn} onChange={e=>setCheckIn(e.target.value)}/>}
    <InfoBox color="amber">⚠️ Yesterday's record is editable only for 1 day. This is the last time you can edit this date.</InfoBox>
    <div style={{display:"flex",gap:10}}>
      <Btn onClick={()=>onSave(checkIn,absent)} color="amber" style={{flex:1}}>Save</Btn>
      <Btn onClick={onClose} color="ghost">Cancel</Btn>
    </div>
  </div>;
}

// ── STUDENTS ──────────────────────────────────────────────────────
function Students({students,setStudents,teachers,enrollments,setEnrollments,settings,results}){
  const [modal,setModal]=useState(false);
  const [editId,setEditId]=useState(null);
  const [viewId,setViewId]=useState(null);
  const [search,setSearch]=useState("");
  const [courseFilter,setCourseFilter]=useState("");
  const [subjectFilter,setSubjectFilter]=useState("");
  const [teacherFilter,setTeacherFilter]=useState("");
  const [activeTab,setActiveTab]=useState("all");

  const blank={studentId:"",name:"",contact:"",address:"",parentName:"",parentContact:"",course:"",enrolledSubjects:[],monthlyFee:"",joinDate:"",notes:"",assignments:[]};
  const [form,setForm]=useState(blank);
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  // Collect unique courses
  const allCourses=[...new Set(students.map(s=>s.course).filter(Boolean))];
  const allSubjects=settings.subjects||[];

  const filtered=students.filter(s=>{
    const q=search.toLowerCase();
    const matchSearch=!search||[(s.name||""),(s.studentId||""),(s.parentName||"")].some(v=>v.toLowerCase().includes(q));
    const matchCourse=!courseFilter||(s.course||"")===(courseFilter);
    const matchSubject=!subjectFilter||(s.enrolledSubjects||[]).includes(subjectFilter);
    const matchTeacher=!teacherFilter||enrollments.some(e=>e.studentId===s.id&&e.teacherId===teacherFilter);
    return matchSearch&&matchCourse&&matchSubject&&matchTeacher;
  });

  function openAdd(){setEditId(null);setForm({...blank});setModal(true);}
  function openEdit(s){
    setEditId(s.id);
    const myA=enrollments.filter(e=>e.studentId===s.id).map(e=>({id:e.id,teacherId:e.teacherId,subject:e.subject,subjectFee:e.subjectFee||0}));
    setForm({...blank,...s,assignments:myA});
    setModal(true);
  }

  function validate(){
    if(!form.studentId.trim())return"Student ID is required.";
    if(!form.name.trim())return"Full name is required.";
    if(!form.course.trim())return"Course is required.";
    if(!form.monthlyFee||isNaN(+form.monthlyFee))return"Monthly tuition fee is required.";
    if(!(form.enrolledSubjects||[]).length)return"Select at least one enrolled subject.";
    if(!(form.assignments||[]).length)return"Assign at least one subject → teacher → fee.";
    return null;
  }

  function save(){
    const err=validate();
    if(err)return alert(err);
    const sid=editId||uid();
    if(editId)setStudents(p=>p.map(s=>s.id===editId?{...form,id:editId,assignments:undefined}:s));
    else setStudents(p=>[...p,{...form,id:sid,assignments:undefined}]);
    const studentId=editId||sid;
    const newE=(form.assignments||[]).map(a=>({id:a.id||uid(),studentId,teacherId:a.teacherId,subject:a.subject,subjectFee:a.subjectFee||0}));
    setEnrollments(p=>[...p.filter(e=>e.studentId!==studentId),...newE]);
    setModal(false);
  }

  function del(id){
    if(!window.confirm("Delete this student? All their records will be removed."))return;
    setStudents(p=>p.filter(s=>s.id!==id));
    setEnrollments(p=>p.filter(e=>e.studentId!==id));
  }

  const vs=students.find(s=>s.id===viewId);
  const vsEnroll=enrollments.filter(e=>e.studentId===viewId);
  const vsResults=results.filter(r=>r.studentId===viewId);

  function handlePrintAll(){
    const rows=filtered.map(s=>{
      const myE=enrollments.filter(e=>e.studentId===s.id);
      return `<tr>
        <td>${s.studentId||"—"}</td>
        <td><b>${s.name}</b></td>
        <td>${s.course||"—"}</td>
        <td>${(s.enrolledSubjects||[]).join(", ")||"—"}</td>
        <td>${s.contact||"—"}</td>
        <td>${s.parentName||"—"}</td>
        <td>${s.parentContact||"—"}</td>
        <td>${s.monthlyFee?fmt(s.monthlyFee):"—"}</td>
      </tr>`;
    }).join("");
    printContent("Student List",`
      <p style="font-size:12px;color:#6b7280;margin-bottom:12px;">Total: ${filtered.length} students${courseFilter?` | Course: ${courseFilter}`:""}${subjectFilter?` | Subject: ${subjectFilter}`:""}</p>
      <table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Subjects</th><th>Contact</th><th>Parent</th><th>Parent Contact</th><th>Monthly Fee</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  function handlePrintProfile(){
    if(!vs)return;
    const myE=vsEnroll;
    const assignRows=myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return `<tr><td><span class="badge badge-blue">${e.subject}</span></td><td>${t?.name||"—"}</td><td>${e.subjectFee?fmt(e.subjectFee):"—"}</td></tr>`;}).join("");
    const resRows=vsResults.map(r=>`<tr><td>${r.examName}</td><td>${r.examType||"—"}</td><td>${r.subject||"—"}</td><td>${r.teacher||"—"}</td><td>${r.score}/${r.totalMarks}</td><td><span class="badge badge-${r.grade==="A+"||r.grade==="A"?"green":r.grade==="F"?"red":"amber"}">${r.grade||"—"}</span></td><td>${r.date}</td></tr>`).join("");
    printContent(`Student Profile — ${vs.name}`,`
      <div class="card"><h3>${vs.name} ${vs.studentId?"("+vs.studentId+")":""}</h3>
      <div class="detail-grid">
        <div class="detail-item"><div class="lbl">Course</div><div class="val">${vs.course||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Contact</div><div class="val">${vs.contact||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Parent</div><div class="val">${vs.parentName||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Parent Contact</div><div class="val">${vs.parentContact||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Address</div><div class="val">${vs.address||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Join Date</div><div class="val">${vs.joinDate||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Monthly Fee</div><div class="val">${vs.monthlyFee?fmt(vs.monthlyFee):"—"}</div></div>
        <div class="detail-item"><div class="lbl">Subjects</div><div class="val">${(vs.enrolledSubjects||[]).join(", ")||"—"}</div></div>
      </div></div>
      ${myE.length?`<h2>Teacher Assignments</h2><table><thead><tr><th>Subject</th><th>Teacher</th><th>Subject Fee</th></tr></thead><tbody>${assignRows}</tbody></table>`:""}
      ${vsResults.length?`<h2>Exam Results</h2><table><thead><tr><th>Exam</th><th>Type</th><th>Subject</th><th>Teacher</th><th>Score</th><th>Grade</th><th>Date</th></tr></thead><tbody>${resRows}</tbody></table>`:""}
      ${vs.notes?`<div class="card" style="margin-top:10px;"><b>Notes:</b> ${vs.notes}</div>`:""}`);
  }

  return <div>
    <SHdr title="Students" sub={`${students.length} enrolled`} action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrintAll} color="ghost" style={{fontSize:12}}>🖨 Print List</Btn><Btn onClick={openAdd}>+ Add Student</Btn></div>}/>

    {/* Filter bar */}
    <Card style={{padding:14,marginBottom:14}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, ID, parent…" style={{...IS,fontSize:12}} onFocus={focusIn} onBlur={focusOut}/>
        <select value={courseFilter} onChange={e=>setCourseFilter(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Courses</option>{allCourses.map(c=><option key={c} value={c}>{c}</option>)}</select>
        <select value={subjectFilter} onChange={e=>setSubjectFilter(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Subjects</option>{allSubjects.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <select value={teacherFilter} onChange={e=>setTeacherFilter(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Teachers</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
      </div>
      {(courseFilter||subjectFilter||teacherFilter||search)&&<button onClick={()=>{setCourseFilter("");setSubjectFilter("");setTeacherFilter("");setSearch("");}} style={{fontSize:11,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>✕ Clear filters</button>}
    </Card>

    {filtered.length===0?<Empty icon="🎓" msg={search||courseFilter||subjectFilter||teacherFilter?"No results.":"No students yet."}/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {filtered.map(s=>{
        const myE=enrollments.filter(e=>e.studentId===s.id);
        return <Card key={s.id} style={{padding:14}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:14}}>{s.name}</span>
                {s.studentId&&<Badge color="navy">{s.studentId}</Badge>}
                {s.course&&<Badge color="purple">{s.course}</Badge>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{s.contact||"No contact"}{s.parentName?` · Parent: ${s.parentName}`:""}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{(s.enrolledSubjects||[]).map(sub=><Badge key={sub} color="blue">{sub}</Badge>)}</div>
              {myE.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <span key={e.id} style={{fontSize:10,background:"#f0fdf4",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:600}}>{e.subject} → {t?.name||"?"} {e.subjectFee?`(${fmt(e.subjectFee)})`:""}</span>;})}</div>}
            </div>
            {s.monthlyFee&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontWeight:800,color:AM,fontSize:14}}>{fmt(s.monthlyFee)}</div><div style={{fontSize:10,color:"#9ca3af"}}>/month</div></div>}
          </div>
          <HR/>
          <div style={{display:"flex",gap:14}}>
            <button onClick={()=>setViewId(s.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>View</button>
            <button onClick={()=>openEdit(s)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
            <button onClick={()=>del(s.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>;
      })}
    </div>}

    {modal&&<Modal title={editId?"Edit Student":"Add New Student"} onClose={()=>setModal(false)} wide>
      <p style={{fontSize:11,color:"#9ca3af",marginBottom:14}}>All starred fields are required to save a student.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <FI label="Student ID" req value={form.studentId} onChange={e=>sf("studentId",e.target.value)} placeholder="e.g. STU-001"/>
        <FI label="Full Name" req value={form.name} onChange={e=>sf("name",e.target.value)}/>
        <FI label="Course / Program" req value={form.course} onChange={e=>sf("course",e.target.value)} placeholder="e.g. O Level, A Level, Juniors"/>
        <FI label="Monthly Tuition Fee (৳)" req type="number" value={form.monthlyFee} onChange={e=>sf("monthlyFee",e.target.value)}/>
        <FI label="Contact Number" value={form.contact} onChange={e=>sf("contact",e.target.value)}/>
        <FI label="Joining Date" type="date" value={form.joinDate} onChange={e=>sf("joinDate",e.target.value)}/>
        <FI label="Parent / Guardian" value={form.parentName} onChange={e=>sf("parentName",e.target.value)}/>
        <FI label="Parent Contact" value={form.parentContact} onChange={e=>sf("parentContact",e.target.value)}/>
      </div>
      <FI label="Address" value={form.address} onChange={e=>sf("address",e.target.value)}/>
      <FM label="Enrolled Subjects" req options={settings.subjects||[]} selected={form.enrolledSubjects||[]} onChange={v=>sf("enrolledSubjects",v)}/>
      <SubjectFeeEditor assignments={form.assignments||[]} onChange={v=>sf("assignments",v)} teachers={teachers} subjects={settings.subjects||[]}/>
      <FTA label="Notes (optional)" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10,marginTop:6}}><Btn onClick={save} style={{flex:1}}>{editId?"Update Student":"Add Student"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {vs&&<Modal title="Student Profile" onClose={()=>setViewId(null)} wide>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
        <Btn onClick={handlePrintProfile} color="ghost" style={{fontSize:12}}>🖨 Print Profile</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["Student ID",vs.studentId||"—"],["Full Name",vs.name],["Course",vs.course||"—"],["Contact",vs.contact||"—"],["Address",vs.address||"—"],["Parent",vs.parentName||"—"],["Parent Contact",vs.parentContact||"—"],["Monthly Fee",vs.monthlyFee?fmt(vs.monthlyFee):"—"],["Joining Date",vs.joinDate||"—"]].map(([k,v])=>(
          <div key={k} style={{background:"#f9fafb",borderRadius:10,padding:10}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em"}}>{k}</div>
            <div style={{fontWeight:700,color:"#1f2937",fontSize:13,marginTop:2}}>{v}</div>
          </div>))}
      </div>
      {(vs.enrolledSubjects||[]).length>0&&<div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Enrolled Subjects</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{vs.enrolledSubjects.map(s=><Badge key={s} color="blue">{s}</Badge>)}</div></div>}
      <div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Teacher Assignments & Fees</div>
        {vsEnroll.length===0?<p style={{fontSize:12,color:"#9ca3af"}}>No assignments.</p>
        :vsEnroll.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <div key={e.id} style={{fontSize:12,marginBottom:5,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>• <Badge color="blue">{e.subject}</Badge><span style={{color:"#6b7280",marginLeft:4}}>→ {t?.name||"—"}</span>{e.subjectFee?<Badge color="green">{fmt(e.subjectFee)}</Badge>:null}</div>;})}
      </div>
      {vsResults.length>0&&<div style={{marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Recent Results</div>
        {vsResults.slice(0,3).map(r=><div key={r.id} style={{fontSize:12,display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
          <Badge color="purple">{r.examName}</Badge><Badge color="blue">{r.subject||"—"}</Badge>
          <span style={{color:"#374151",fontWeight:700}}>{r.score}/{r.totalMarks}</span>
          {r.grade&&<Badge color={r.grade==="A+"||r.grade==="A"?"green":r.grade==="F"?"red":"amber"}>{r.grade}</Badge>}
        </div>)}
      </div>}
      {vs.notes&&<div style={{background:"#fffbeb",borderRadius:10,padding:10,fontSize:13,color:"#92400e"}}><b>Notes: </b>{vs.notes}</div>}
    </Modal>}
  </div>;
}

// ── COURSES VIEW ──────────────────────────────────────────────────
function Courses({students,teachers,enrollments,settings}){
  const [selectedCourse,setSelectedCourse]=useState("");
  const [selectedSubject,setSelectedSubject]=useState("");
  const [selectedTeacher,setSelectedTeacher]=useState("");

  const allCourses=[...new Set(students.map(s=>s.course).filter(Boolean))];
  const allSubjects=settings.subjects||[];

  const filtered=students.filter(s=>{
    const matchCourse=!selectedCourse||(s.course||"")===(selectedCourse);
    const matchSubject=!selectedSubject||(s.enrolledSubjects||[]).includes(selectedSubject);
    const matchTeacher=!selectedTeacher||enrollments.some(e=>e.studentId===s.id&&e.teacherId===selectedTeacher);
    return matchCourse&&matchSubject&&matchTeacher;
  });

  function handlePrint(){
    const byGroup={};
    if(selectedCourse){
      byGroup[selectedCourse]=filtered;
    } else if(selectedSubject){
      byGroup[selectedSubject]=filtered;
    } else {
      filtered.forEach(s=>{const c=s.course||"No Course";if(!byGroup[c])byGroup[c]=[];byGroup[c].push(s);});
    }
    let html="";
    Object.entries(byGroup).forEach(([grp,sts])=>{
      html+=`<h2>${grp} (${sts.length})</h2><table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Subjects</th><th>Contact</th><th>Parent</th></tr></thead><tbody>`;
      html+=sts.map(s=>`<tr><td>${s.studentId||"—"}</td><td><b>${s.name}</b></td><td>${s.course||"—"}</td><td>${(s.enrolledSubjects||[]).join(", ")||"—"}</td><td>${s.contact||"—"}</td><td>${s.parentName||"—"}</td></tr>`).join("");
      html+=`</tbody></table>`;
    });
    printContent("Students by Course/Subject",html);
  }

  // Group students by course for display
  const byCourse={};
  if(!selectedCourse&&!selectedSubject&&!selectedTeacher){
    filtered.forEach(s=>{const c=s.course||"No Course";if(!byCourse[c])byCourse[c]=[];byCourse[c].push(s);});
  }

  return <div>
    <SHdr title="Courses & Groups" sub="View students by course, subject, or teacher" action={<Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn>}/>

    <Card style={{padding:14,marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <div>
          <FL label="Filter by Course"/>
          <select value={selectedCourse} onChange={e=>setSelectedCourse(e.target.value)} style={IS}><option value="">All Courses</option>{allCourses.map(c=><option key={c} value={c}>{c}</option>)}</select>
        </div>
        <div>
          <FL label="Filter by Subject"/>
          <select value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)} style={IS}><option value="">All Subjects</option>{allSubjects.map(s=><option key={s} value={s}>{s}</option>)}</select>
        </div>
        <div>
          <FL label="Filter by Teacher"/>
          <select value={selectedTeacher} onChange={e=>setSelectedTeacher(e.target.value)} style={IS}><option value="">All Teachers</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
        </div>
      </div>
      {(selectedCourse||selectedSubject||selectedTeacher)&&<button onClick={()=>{setSelectedCourse("");setSelectedSubject("");setSelectedTeacher("");}} style={{fontSize:11,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer",marginTop:8}}>✕ Clear filters</button>}
    </Card>

    {(selectedCourse||selectedSubject||selectedTeacher)?
      // Flat list when filtered
      <>
        <div style={{fontSize:13,fontWeight:700,color:"#6b7280",marginBottom:10}}>Showing {filtered.length} student{filtered.length!==1?"s":""}{selectedCourse?` in ${selectedCourse}`:""}
        {selectedSubject?` studying ${selectedSubject}`:""}
        {selectedTeacher?` under ${teachers.find(t=>t.id===selectedTeacher)?.name||"?"}`:""}
        </div>
        {filtered.length===0?<Empty icon="🎓" msg="No students match."/>
        :<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {filtered.map(s=>{
            const myE=enrollments.filter(e=>e.studentId===s.id&&(!selectedTeacher||e.teacherId===selectedTeacher)&&(!selectedSubject||e.subject===selectedSubject));
            return <Card key={s.id} style={{padding:12}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:13}}>{s.name}</span>
                {s.studentId&&<Badge color="navy">{s.studentId}</Badge>}
                {s.course&&<Badge color="purple">{s.course}</Badge>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{s.contact||"No contact"}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>
                {myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <span key={e.id} style={{fontSize:10,background:"#f0fdf4",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:600}}>{e.subject} → {t?.name||"?"}</span>;})}
              </div>
            </Card>;
          })}
        </div>}
      </>
    :
      // Grouped by course when no filter
      <>
        {students.length===0?<Empty icon="📚" msg="No students enrolled yet."/>
        :Object.entries(byCourse).sort(([a],[b])=>a.localeCompare(b)).map(([course,sts])=>(
          <Card key={course} style={{padding:0,marginBottom:14,overflow:"hidden"}}>
            <div style={{background:N,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:800,color:"#fff",fontSize:14}}>{course}</div>
              <Badge color="amber">{sts.length} student{sts.length!==1?"s":""}</Badge>
            </div>
            <div style={{padding:"8px 0"}}>
              {sts.map((s,i)=>{
                const myE=enrollments.filter(e=>e.studentId===s.id);
                return <div key={s.id} style={{padding:"8px 16px",borderBottom:i<sts.length-1?"1px solid #f5f5f5":"none"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,color:N,fontSize:13}}>{s.name}</span>
                    {s.studentId&&<Badge color="navy">{s.studentId}</Badge>}
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,marginLeft:4}}>
                      {(s.enrolledSubjects||[]).map(sub=><Badge key={sub} color="blue">{sub}</Badge>)}
                    </div>
                  </div>
                  {myE.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:2,marginTop:4}}>
                    {myE.map(e=>{const t=teachers.find(t=>t.id===e.teacherId);return <span key={e.id} style={{fontSize:10,background:"#f0fdf4",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:600}}>{e.subject} → {t?.name||"?"}</span>;})}
                  </div>}
                </div>;
              })}
            </div>
          </Card>))}
      </>}
  </div>;
}

// ── TEACHERS ──────────────────────────────────────────────────────
function Teachers({teachers,setTeachers,students,enrollments,setEnrollments,settings}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);const [viewId,setViewId]=useState(null);
  const blank={teacherId:"",name:"",contact:"",address:"",qualification:"",qualDetails:"",subjects:[],joinDate:"",notes:"",schedule:blankSched()};
  const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  function openAdd(){setEditId(null);setForm({...blank,schedule:blankSched()});setModal(true);}
  function openEdit(t){setEditId(t.id);setForm({...blank,...t,schedule:t.schedule||blankSched()});setModal(true);}

  function validate(){
    if(!form.name.trim())return"Teacher name is required.";
    if(!form.contact.trim())return"Contact number is required.";
    if(!form.qualification.trim())return"Qualification is required.";
    if(!(form.subjects||[]).length)return"Select at least one subject.";
    const activeHasMissingTime=DAYS.filter(d=>form.schedule?.[d]?.active&&!form.schedule[d].startTime);
    if(activeHasMissingTime.length)return`Set start time for: ${activeHasMissingTime.join(", ")}`;
    const hasAtLeastOneDay=DAYS.some(d=>form.schedule?.[d]?.active);
    if(!hasAtLeastOneDay)return"Set at least one class day in the weekly schedule.";
    return null;
  }

  function save(){
    const err=validate();if(err)return alert(err);
    if(editId)setTeachers(p=>p.map(t=>t.id===editId?{...form,id:editId}:t));
    else setTeachers(p=>[...p,{...form,id:uid()}]);
    setModal(false);
  }

  function del(id){
    if(!window.confirm("Delete this teacher?"))return;
    setTeachers(p=>p.filter(t=>t.id!==id));
    setEnrollments(p=>p.filter(e=>e.teacherId!==id));
  }

  const vt=teachers.find(t=>t.id===viewId);

  function handlePrintAll(){
    const rows=teachers.map(t=>{
      const myS=[...new Set(enrollments.filter(e=>e.teacherId===t.id).map(e=>e.studentId))];
      const activeDays=DAYS.filter(d=>t.schedule?.[d]?.active).map(d=>`${DAYS_S[DAYS.indexOf(d)]} ${t.schedule[d].startTime}`).join(", ");
      return `<tr><td>${t.teacherId||"—"}</td><td><b>${t.name}</b></td><td>${t.qualification||"—"}</td><td>${(t.subjects||[]).join(", ")||"—"}</td><td>${t.contact||"—"}</td><td>${myS.length}</td><td style="font-size:10px;">${activeDays||"—"}</td></tr>`;
    }).join("");
    printContent("Teacher List",`<table><thead><tr><th>ID</th><th>Name</th><th>Qualification</th><th>Subjects</th><th>Contact</th><th>Students</th><th>Schedule</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  function handlePrintProfile(){
    if(!vt)return;
    const myEnroll=enrollments.filter(e=>e.teacherId===vt.id);
    const studentIds=[...new Set(myEnroll.map(e=>e.studentId))];
    const schedRows=DAYS.map(d=>{const info=vt.schedule?.[d];const has=info?.active;return `<tr><td><b>${d}</b></td><td>${has?`🕐 ${info.startTime}`:"No Class"}</td></tr>`;}).join("");
    const studentRows=studentIds.map(sid=>{const st=students.find(s=>s.id===sid);const subs=myEnroll.filter(e=>e.studentId===sid).map(e=>e.subject);return st?`<tr><td>${st.name} ${st.studentId?"("+st.studentId+")":""}</td><td>${st.course||"—"}</td><td>${subs.join(", ")}</td><td>${st.contact||"—"}</td></tr>`:""}).join("");
    printContent(`Teacher Profile — ${vt.name}`,`
      <div class="card"><h3>${vt.name} ${vt.teacherId?"("+vt.teacherId+")":""}</h3>
      <div class="detail-grid">
        <div class="detail-item"><div class="lbl">Qualification</div><div class="val">${vt.qualification||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Contact</div><div class="val">${vt.contact||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Address</div><div class="val">${vt.address||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Join Date</div><div class="val">${vt.joinDate||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Subjects</div><div class="val">${(vt.subjects||[]).join(", ")||"—"}</div></div>
        <div class="detail-item"><div class="lbl">Students</div><div class="val">${studentIds.length}</div></div>
      </div></div>
      ${vt.qualDetails?`<div class="card"><b>Qualification Details:</b><p style="margin-top:4px;">${vt.qualDetails}</p></div>`:""}
      <h2>Weekly Schedule</h2><table><thead><tr><th>Day</th><th>Class Time</th></tr></thead><tbody>${schedRows}</tbody></table>
      ${studentIds.length?`<h2>Students (${studentIds.length})</h2><table><thead><tr><th>Name</th><th>Course</th><th>Subjects</th><th>Contact</th></tr></thead><tbody>${studentRows}</tbody></table>`:""}`);
  }

  return <div>
    <SHdr title="Teachers" sub={`${teachers.length} on staff`} action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrintAll} color="ghost" style={{fontSize:12}}>🖨 Print List</Btn><Btn onClick={openAdd} color="amber">+ Add Teacher</Btn></div>}/>

    {teachers.length===0?<Empty icon="👩‍🏫" msg="No teachers yet."/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {teachers.map(t=>{
        const myS=[...new Set(enrollments.filter(e=>e.teacherId===t.id).map(e=>e.studentId))];
        const activeDays=DAYS.filter(d=>t.schedule?.[d]?.active);
        return <Card key={t.id} style={{padding:14}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:14}}>{t.name}</span>
                {t.teacherId&&<Badge color="amber">{t.teacherId}</Badge>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{t.contact||"No contact"}{t.qualification?` · ${t.qualification}`:""}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{(t.subjects||[]).map(s=><Badge key={s} color="teal">{s}</Badge>)}</div>
              {activeDays.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>{activeDays.map(d=><span key={d} style={{fontSize:10,background:"#d1fae5",color:"#065f46",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 7px",fontWeight:700}}>{DAYS_S[DAYS.indexOf(d)]} {t.schedule[d].startTime}</span>)}</div>}
            </div>
            <Badge color="navy">{myS.length} student{myS.length!==1?"s":""}</Badge>
          </div>
          <HR/>
          <div style={{display:"flex",gap:14}}>
            <button onClick={()=>setViewId(t.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>View</button>
            <button onClick={()=>openEdit(t)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
            <button onClick={()=>del(t.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>;
      })}
    </div>}

    {modal&&<Modal title={editId?"Edit Teacher":"Add New Teacher"} onClose={()=>setModal(false)} wide>
      <p style={{fontSize:11,color:"#9ca3af",marginBottom:14}}>All starred fields are required.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <FI label="Teacher ID" value={form.teacherId} onChange={e=>sf("teacherId",e.target.value)} placeholder="e.g. TCH-001"/>
        <FI label="Full Name" req value={form.name} onChange={e=>sf("name",e.target.value)}/>
        <FI label="Contact Number" req value={form.contact} onChange={e=>sf("contact",e.target.value)}/>
        <FI label="Qualification" req value={form.qualification} onChange={e=>sf("qualification",e.target.value)} placeholder="e.g. M.Sc, B.Ed"/>
        <FI label="Join Date" type="date" value={form.joinDate} onChange={e=>sf("joinDate",e.target.value)}/>
      </div>
      <FI label="Address" value={form.address} onChange={e=>sf("address",e.target.value)}/>
      <FTA label="Qualification Details (optional)" rows={3} value={form.qualDetails||""} onChange={e=>sf("qualDetails",e.target.value)} placeholder="e.g. M.Sc in Mathematics from Dhaka University…"/>
      <FM label="Subjects They Teach" req options={settings.subjects||[]} selected={form.subjects||[]} onChange={v=>sf("subjects",v)}/>
      <WeeklyScheduleEditor schedule={form.schedule||blankSched()} onChange={v=>sf("schedule",v)}/>
      <FTA label="Notes (optional)" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10,marginTop:6}}><Btn onClick={save} color="amber" style={{flex:1}}>{editId?"Update Teacher":"Add Teacher"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {vt&&<Modal title="Teacher Profile" onClose={()=>setViewId(null)} wide>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
        <Btn onClick={handlePrintProfile} color="ghost" style={{fontSize:12}}>🖨 Print Profile</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["Teacher ID",vt.teacherId||"—"],["Name",vt.name],["Contact",vt.contact||"—"],["Qualification",vt.qualification||"—"],["Address",vt.address||"—"],["Join Date",vt.joinDate||"—"]].map(([k,v])=>(
          <div key={k} style={{background:"#f9fafb",borderRadius:10,padding:10}}><div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em"}}>{k}</div><div style={{fontWeight:700,color:"#1f2937",fontSize:13,marginTop:2}}>{v}</div></div>))}
      </div>
      {vt.qualDetails&&<div style={{background:"#f0fdf4",borderRadius:10,padding:12,marginBottom:14,fontSize:13,color:"#065f46"}}><b>Qualification Details:</b><p style={{marginTop:4,whiteSpace:"pre-wrap"}}>{vt.qualDetails}</p></div>}
      {(vt.subjects||[]).length>0&&<div style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Subjects</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{vt.subjects.map(s=><Badge key={s} color="teal">{s}</Badge>)}</div></div>}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Weekly Schedule</div>
        <div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden"}}>
          {DAYS.map((day,i)=>{const info=vt.schedule?.[day];const has=info?.active;return <div key={day} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 12px",borderBottom:i<6?"1px solid #f3f4f6":"none",background:has?"#f0fdf4":"#fafafa"}}>
            <span style={{fontWeight:700,fontSize:12,color:has?"#065f46":"#d1d5db"}}>{day}</span>
            {has?<span style={{fontWeight:700,fontSize:12,color:"#065f46",background:"#d1fae5",border:"1px solid #a7f3d0",borderRadius:7,padding:"2px 8px"}}>🕐 {info.startTime||"—"}</span>:<span style={{fontSize:11,fontWeight:700,color:"#d1d5db",background:"#f3f4f6",borderRadius:999,padding:"2px 8px"}}>No Class</span>}
          </div>;})}
        </div>
      </div>

      {/* Students grouped by subject */}
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Students by Subject</div>
        {(vt.subjects||[]).map(subj=>{
          const subEnroll=enrollments.filter(e=>e.teacherId===vt.id&&e.subject===subj);
          return <div key={subj} style={{marginBottom:10}}>
            <div style={{fontWeight:700,fontSize:12,color:N,background:"#eef2ff",borderRadius:8,padding:"5px 10px",marginBottom:5,display:"flex",justifyContent:"space-between"}}>
              <span>{subj}</span><Badge color="navy">{subEnroll.length}</Badge>
            </div>
            {subEnroll.length===0?<p style={{fontSize:11,color:"#9ca3af",paddingLeft:10}}>No students for this subject.</p>
            :subEnroll.map(e=>{const st=students.find(s=>s.id===e.studentId);return st?<div key={e.id} style={{fontSize:12,padding:"4px 10px",borderBottom:"1px solid #f9fafb",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontWeight:700,color:"#374151"}}>{st.name}</span>
              {st.studentId&&<span style={{color:"#9ca3af"}}>({st.studentId})</span>}
              {st.course&&<Badge color="purple">{st.course}</Badge>}
            </div>:null;})}
          </div>;
        })}
      </div>

      {vt.notes&&<div style={{background:"#fffbeb",borderRadius:10,padding:10,fontSize:13,color:"#92400e",marginTop:10}}><b>Notes: </b>{vt.notes}</div>}
    </Modal>}
  </div>;
}

// ── MONTHLY FEES ──────────────────────────────────────────────────
function Fees({students,feeRecords,setFeeRecords,enrollments,teachers,settings}){
  const [month,setMonth]=useState(thisMonth());const [modal,setModal]=useState(false);const [histId,setHistId]=useState(null);const [editRecId,setEditRecId]=useState(null);
  const blank={studentId:"",month:thisMonth(),amountPaid:"",paidDate:today(),paymentMethod:"",notes:""};
  const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<18;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);
  const mRecs=feeRecords.filter(r=>r.month===month);
  const paidIds=new Set(mRecs.filter(r=>r.status==="paid").map(r=>r.studentId));
  const collected=feeRecords.filter(r=>r.month===month).reduce((s,r)=>s+(+r.amountPaid||0),0);
  const totalDue=students.reduce((s,st)=>s+(+st.monthlyFee||0),0);
  const pct=totalDue>0?Math.min(100,Math.round(collected/totalDue*100)):0;

  function openPay(st){setEditRecId(null);setForm({...blank,studentId:st.id,month,amountPaid:"",paymentMethod:(settings.paymentMethods||[])[0]||""});setModal(true);}
  function openEditRec(r){setEditRecId(r.id);setForm({studentId:r.studentId,month:r.month,amountPaid:String(r.amountPaid),paidDate:r.paidDate,paymentMethod:r.paymentMethod||"",notes:r.notes||""});setModal(true);}
  function openCustom(){setEditRecId(null);setForm({...blank,month,paymentMethod:(settings.paymentMethods||[])[0]||""});setModal(true);}

  function save(){
    if(!form.studentId||!form.amountPaid)return alert("Student and amount required.");
    const st=students.find(s=>s.id===form.studentId);
    const due=+(st?.monthlyFee||0);
    const paid=+form.amountPaid;
    const status=due>0&&paid<due?"partial":"paid";
    const rec={...form,status,amountPaid:paid,due};
    if(editRecId)setFeeRecords(p=>p.map(r=>r.id===editRecId?{...rec,id:editRecId}:r));
    else setFeeRecords(p=>[...p,{...rec,id:uid()}]);
    setModal(false);
  }

  function del(id){if(!window.confirm("Delete?"))return;setFeeRecords(p=>p.filter(r=>r.id!==id));}

  const hs=students.find(s=>s.id===histId);
  const histRecs=feeRecords.filter(r=>r.studentId===histId).sort((a,b)=>b.month.localeCompare(a.month)||b.paidDate.localeCompare(a.paidDate));

  function handlePrint(){
    const rows=students.map(st=>{
      const stRecs=mRecs.filter(r=>r.studentId===st.id);
      const totalPaid=stRecs.reduce((s,r)=>s+(+r.amountPaid||0),0);
      const due=+(st.monthlyFee||0);
      const remaining=Math.max(0,due-totalPaid);
      const isFullyPaid=due>0&&remaining===0;
      const hasPartial=totalPaid>0&&!isFullyPaid;
      const status=isFullyPaid?"Paid":hasPartial?"Partial":"Pending";
      return `<tr><td>${st.studentId||"—"}</td><td><b>${st.name}</b></td><td>${fmt(due)}</td><td>${fmt(totalPaid)}</td><td>${fmt(remaining)}</td><td><span class="badge badge-${isFullyPaid?"green":hasPartial?"amber":"red"}">${status}</span></td></tr>`;
    }).join("");
    printContent(`Fee Collection — ${mLabel(month)}`,`
      <div class="detail-grid" style="margin-bottom:14px;">
        <div class="detail-item"><div class="lbl">Collected</div><div class="val">${fmt(collected)}</div></div>
        <div class="detail-item"><div class="lbl">Still Due</div><div class="val">${fmt(Math.max(0,totalDue-collected))}</div></div>
        <div class="detail-item"><div class="lbl">Total Due</div><div class="val">${fmt(totalDue)}</div></div>
        <div class="detail-item"><div class="lbl">Collected %</div><div class="val">${pct}%</div></div>
      </div>
      <table><thead><tr><th>ID</th><th>Name</th><th>Total Fee</th><th>Paid</th><th>Remaining</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Monthly Fees" sub="Track all student fee payments — partial payments supported" action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={openCustom} color="green">+ Record Payment</Btn></div>}/>
    <Card style={{padding:16,marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div><FL label="Select Month"/><select value={month} onChange={e=>setMonth(e.target.value)} style={{...IS,width:"auto",fontWeight:700,color:N}}>{monthOpts.map(m=><option key={m} value={m}>{mLabel(m)}</option>)}</select></div>
        <div style={{marginLeft:"auto",display:"flex",gap:16,textAlign:"center"}}>
          <div><div style={{fontSize:18,fontWeight:800,color:GR}}>{fmt(collected)}</div><div style={{fontSize:11,color:"#9ca3af"}}>Collected</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:AM}}>{fmt(Math.max(0,totalDue-collected))}</div><div style={{fontSize:11,color:"#9ca3af"}}>Still Due</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:"#374151"}}>{fmt(totalDue)}</div><div style={{fontSize:11,color:"#9ca3af"}}>Total Due</div></div>
        </div>
      </div>
      {students.length>0&&<><div style={{marginTop:10,height:7,borderRadius:99,background:"#e5e7eb",overflow:"hidden"}}><div style={{height:"100%",borderRadius:99,background:GR,width:`${pct}%`,transition:"width .3s"}}/></div><div style={{fontSize:11,color:"#9ca3af",marginTop:3,textAlign:"right"}}>{pct}% collected</div></>}
    </Card>
    {students.length===0?<Empty icon="💰" msg="Add students first."/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {students.map(st=>{
        const stRecs=mRecs.filter(r=>r.studentId===st.id).sort((a,b)=>b.paidDate.localeCompare(a.paidDate));
        const totalPaid=stRecs.reduce((s,r)=>s+(+r.amountPaid||0),0);
        const due=+(st.monthlyFee||0);
        const remaining=Math.max(0,due-totalPaid);
        const isFullyPaid=due>0&&remaining===0;
        const hasPartial=totalPaid>0&&!isFullyPaid;
        return <Card key={st.id} style={{padding:14,borderLeft:`4px solid ${isFullyPaid?"#34d399":hasPartial?"#fbbf24":"#f0f0f0"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontWeight:800,color:N,fontSize:13}}>{st.name}</span>
                {st.studentId&&<span style={{fontSize:11,color:"#9ca3af"}}>{st.studentId}</span>}
                {st.course&&<Badge color="purple">{st.course}</Badge>}
                {isFullyPaid&&<Badge color="green">Fully Paid ✓</Badge>}
                {hasPartial&&<Badge color="amber">Partial</Badge>}
                {!totalPaid&&<Badge color="gray">Pending</Badge>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>Fee: {fmt(due)}{remaining>0?` · Remaining: ${fmt(remaining)}`:""}</div>
              {stRecs.length>0&&<div style={{marginTop:5}}>{stRecs.map(r=><div key={r.id} style={{fontSize:11,color:"#6b7280",display:"flex",gap:6,alignItems:"center",marginTop:2,flexWrap:"wrap"}}>
                → Paid {fmt(r.amountPaid)} on {r.paidDate}{r.paymentMethod?` (${r.paymentMethod})`:""}{r.notes?` · ${r.notes}`:""}
                <button onClick={()=>del(r.id)} style={{background:"none",border:"none",color:"#fca5a5",fontSize:14,fontWeight:700,cursor:"pointer",lineHeight:1}}>×</button>
                <button onClick={()=>openEditRec(r)} style={{background:"none",border:"none",color:TE,fontSize:11,fontWeight:700,cursor:"pointer"}}>edit</button>
              </div>)}</div>}
            </div>
            {due>0&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontWeight:800,color:isFullyPaid?GR:AM,fontSize:13}}>{fmt(totalPaid)}</div><div style={{fontSize:10,color:"#9ca3af"}}>of {fmt(due)}</div></div>}
          </div>
          <HR/>
          <div style={{display:"flex",gap:14}}>
            <button onClick={()=>openPay(st)} style={{fontSize:12,fontWeight:700,color:GR,background:"none",border:"none",cursor:"pointer"}}>+ Add Payment</button>
            <button onClick={()=>setHistId(st.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>History</button>
          </div>
        </Card>;
      })}
    </div>}

    {modal&&<Modal title="Record Fee Payment" onClose={()=>setModal(false)}>
      {!editRecId&&<><FSel label="Student" req options={students.map(s=>({value:s.id,label:`${s.name}${s.studentId?` (${s.studentId})`:""}`}))} value={form.studentId} onChange={e=>sf("studentId",e.target.value)}/>
        <FSel label="Month" req options={monthOpts.map(m=>({value:m,label:mLabel(m)}))} value={form.month} onChange={e=>sf("month",e.target.value)}/></>}
      {form.studentId&&(()=>{const st=students.find(s=>s.id===form.studentId);const due=+(st?.monthlyFee||0);const alreadyPaid=feeRecords.filter(r=>r.studentId===form.studentId&&r.month===form.month).reduce((s,r)=>s+(+r.amountPaid||0),0);const remaining=Math.max(0,due-alreadyPaid);return remaining>0&&<InfoBox color="green">Remaining due for {mLabel(form.month)}: <b>{fmt(remaining)}</b></InfoBox>;})()}
      <FI label="Amount Paying Now (৳)" req type="number" value={form.amountPaid} onChange={e=>sf("amountPaid",e.target.value)} placeholder="Enter amount"/>
      <FI label="Payment Date" req type="date" value={form.paidDate} onChange={e=>sf("paidDate",e.target.value)}/>
      {(settings.paymentMethods||[]).length>0?<FSel label="Payment Method" options={settings.paymentMethods} value={form.paymentMethod} onChange={e=>sf("paymentMethod",e.target.value)}/>:<FI label="Payment Method" value={form.paymentMethod} onChange={e=>sf("paymentMethod",e.target.value)} placeholder="e.g. Cash"/>}
      <FTA label="Notes (optional)" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={save} color="green" style={{flex:1}}>Save Payment</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}

    {hs&&<Modal title={`Fee History — ${hs.name}`} onClose={()=>setHistId(null)}>
      {histRecs.length===0?<Empty icon="📋" msg="No payment records."/>
      :<div style={{display:"flex",flexDirection:"column",gap:6}}>
        {[...new Set(histRecs.map(r=>r.month))].map(m=>{const mR=histRecs.filter(r=>r.month===m);const tot=mR.reduce((s,r)=>s+(+r.amountPaid||0),0);const due=mR[0]?.due||0;return <div key={m} style={{background:"#f9fafb",borderRadius:10,padding:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontWeight:700,fontSize:13,color:N}}>{mLabel(m)}</span>
            <Badge color={due&&tot>=due?"green":tot>0?"amber":"gray"}>{fmt(tot)}{due?` / ${fmt(due)}`:""}</Badge>
          </div>
          {mR.map(r=><div key={r.id} style={{fontSize:11,color:"#6b7280",paddingLeft:8}}>→ {fmt(r.amountPaid)} on {r.paidDate}{r.paymentMethod?` (${r.paymentMethod})`:""}{r.notes?` · ${r.notes}`:""}</div>)}
        </div>;})}
        <div style={{background:"#ecfdf5",borderRadius:10,padding:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,fontWeight:700,color:"#065f46"}}>Total (All Time)</span>
          <span style={{fontWeight:800,color:"#065f46"}}>{fmt(histRecs.reduce((s,r)=>s+(+r.amountPaid||0),0))}</span>
        </div>
      </div>}
    </Modal>}
  </div>;
}

// ── TEACHER ATTENDANCE ────────────────────────────────────────────
function TeacherAttendance({attendance,setAttendance,teachers,settings}){
  const [modal,setModal]=useState(false);const [filterT,setFilterT]=useState("");const [filterM,setFilterM]=useState(thisMonth());
  const blank={teacherId:"",date:today(),status:"present",checkIn:"",notes:""};const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<6;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);

  function getExp(teacherId,date){const t=teachers.find(t=>t.id===teacherId);if(!t||!date)return settings.classStart||"";const day=new Date(date+"T00:00:00").toLocaleDateString("en-US",{weekday:"long"});const sc=t.schedule?.[day];if(sc?.active&&sc.startTime)return sc.startTime;return settings.classStart||"";}
  const expStart=useMemo(()=>getExp(form.teacherId,form.date),[form.teacherId,form.date]);

  function save(){
    if(!form.teacherId)return alert("Select a teacher.");
    if(form.status==="present"&&!form.checkIn)return alert("Check-in time is required.");
    const start=getExp(form.teacherId,form.date);
    const lateFlag=form.status==="present"&&isLate(form.checkIn,start);
    setAttendance(p=>[...p,{...form,id:uid(),isLate:lateFlag,status:lateFlag?"late":form.status,expectedStart:start}]);
    setModal(false);
  }

  function del(id){setAttendance(p=>p.filter(r=>r.id!==id));}
