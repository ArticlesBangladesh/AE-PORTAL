  const filtered=[...attendance].filter(a=>(!filterT||a.teacherId===filterT)&&(!filterM||a.date.startsWith(filterM))).sort((a,b)=>b.date.localeCompare(a.date)||(b.checkIn||"").localeCompare(a.checkIn||""));
  const STATUS_COLOR={present:"green",late:"amber",absent:"red"};

  function handlePrint(){
    const rows=filtered.map(a=>{const t=teachers.find(t=>t.id===a.teacherId);const s=a.status||"present";return `<tr><td>${a.date}</td><td><b>${t?.name||"?"}</b></td><td>${a.checkIn||"—"}</td><td>${a.expectedStart||"—"}</td><td><span class="badge badge-${s==="present"?"green":s==="late"?"amber":"red"}">${s.charAt(0).toUpperCase()+s.slice(1)}</span></td><td>${a.notes||""}</td></tr>`;}).join("");
    printContent("Teacher Attendance",`<table><thead><tr><th>Date</th><th>Teacher</th><th>Check-In</th><th>Expected</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Teacher Attendance" sub={settings.classStart?`Default start: ${settings.classStart}`:"⚠️ Set class start in Settings"} action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={()=>{setForm(blank);setModal(true);}} color="amber">+ Mark Attendance</Btn></div>}/>
    {!settings.classStart&&<InfoBox>⚙️ Set class start time in <b>Settings</b> first.</InfoBox>}

    {teachers.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      {teachers.map(t=>{const lates=attendance.filter(a=>a.teacherId===t.id&&(a.isLate||a.status==="late")).length;const absents=attendance.filter(a=>a.teacherId===t.id&&a.status==="absent").length;const total=attendance.filter(a=>a.teacherId===t.id).length;return <Card key={t.id} style={{padding:12}}>
        <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <div><div style={{fontSize:18,fontWeight:800,color:AM}}>{lates}</div><div style={{fontSize:10,color:"#9ca3af"}}>Late</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:RE}}>{absents}</div><div style={{fontSize:10,color:"#9ca3af"}}>Absent</div></div>
          <div><div style={{fontSize:18,fontWeight:800,color:"#9ca3af"}}>{total}</div><div style={{fontSize:10,color:"#9ca3af"}}>Days</div></div>
        </div>
      </Card>;})}
    </div>}

    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <select value={filterT} onChange={e=>setFilterT(e.target.value)} style={{...IS,flex:1}}><option value="">All Teachers</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
      <select value={filterM} onChange={e=>setFilterM(e.target.value)} style={{...IS,flex:1}}><option value="">All Months</option>{monthOpts.map(m=><option key={m} value={m}>{mLabel(m)}</option>)}</select>
    </div>

    {filtered.length===0?<Empty icon="📅" msg="No records found."/>
    :<div style={{display:"flex",flexDirection:"column",gap:7}}>
      {filtered.map(a=>{const t=teachers.find(t=>t.id===a.teacherId);const s=a.status||"present";return <Card key={a.id} style={{padding:12,display:"flex",alignItems:"center",justifyContent:"space-between",borderLeft:`4px solid ${s==="absent"?RE:s==="late"?AM:GR}`}}>
        <div><div style={{fontWeight:700,fontSize:13,color:N}}>{t?.name||"Unknown"}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{a.date}{a.checkIn?` · Check-in: ${a.checkIn}`:""}{a.expectedStart&&a.checkIn?` (expected ${a.expectedStart})`:""}{a.notes?` · ${a.notes}`:""}</div></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}><Badge color={STATUS_COLOR[s]||"gray"}>{s.charAt(0).toUpperCase()+s.slice(1)}</Badge><button onClick={()=>del(a.id)} style={{background:"none",border:"none",color:"#d1d5db",fontSize:18,fontWeight:700,cursor:"pointer"}}>×</button></div>
      </Card>;})}
    </div>}

    {modal&&<Modal title="Mark Teacher Attendance" onClose={()=>setModal(false)}>
      <FSel label="Teacher" req options={teachers.map(t=>({value:t.id,label:t.name}))} value={form.teacherId} onChange={e=>sf("teacherId",e.target.value)}/>
      <FI label="Date" req type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
      {form.teacherId&&form.date&&(()=>{const day=new Date(form.date+"T00:00:00").toLocaleDateString("en-US",{weekday:"long"});const t=teachers.find(t=>t.id===form.teacherId);const sc=t?.schedule?.[day];return <InfoBox color="green">📅 <b>{day}</b>: {sc?.active?`Class starts ${sc.startTime||"time not set"}`:`No scheduled class (default: ${settings.classStart||"not set"})`}</InfoBox>;})()}
      <div style={{marginBottom:14}}>
        <FL label="Status"/>
        <div style={{display:"flex",gap:8}}>
          {["present","absent"].map(s=><button key={s} type="button" onClick={()=>sf("status",s)} style={{flex:1,padding:"9px",borderRadius:10,border:`2px solid ${form.status===s?(s==="absent"?RE:GR):"#e5e7eb"}`,background:form.status===s?(s==="absent"?"#fef2f2":"#f0fdf4"):"#fff",color:form.status===s?(s==="absent"?RE:GR):"#6b7280",fontWeight:700,fontSize:13,cursor:"pointer",textTransform:"capitalize"}}>{s==="present"?"Present / Late":s.charAt(0).toUpperCase()+s.slice(1)}</button>)}
        </div>
      </div>
      {form.status!=="absent"&&<FI label="Check-in Time" req type="time" value={form.checkIn} onChange={e=>sf("checkIn",e.target.value)}/>}
      {form.status!=="absent"&&form.checkIn&&<div style={{borderRadius:10,padding:"8px 12px",fontSize:13,fontWeight:700,marginBottom:12,background:isLate(form.checkIn,expStart)?"#fef2f2":"#f0fdf4",color:isLate(form.checkIn,expStart)?RE:GR}}>{isLate(form.checkIn,expStart)?`⚠️ Late — expected ${expStart||"not set"}`:`✅ On time — expected ${expStart||"not set"}`}</div>}
      <FTA label="Notes (optional)" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={save} color="amber" style={{flex:1}}>Save Record</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
  </div>;
}

// ── EXAM RESULTS ──────────────────────────────────────────────────
const GRADE_BOUNDARIES=[
  {grade:"A+",min:90},
  {grade:"A",min:80},
  {grade:"B+",min:70},
  {grade:"B",min:60},
  {grade:"C",min:50},
  {grade:"D",min:40},
  {grade:"F",min:0}
];
function autoGrade(score,total){
  if(!score||!total||isNaN(+score)||isNaN(+total)||+total===0)return"";
  const pct=(+score/+total)*100;
  for(const b of GRADE_BOUNDARIES){if(pct>=b.min)return b.grade;}
  return"F";
}

function Results({results,setResults,students,teachers,settings}){
  const [modal,setModal]=useState(false);
  const [editId,setEditId]=useState(null);
  const [viewStudentId,setViewStudentId]=useState("");
  const [filterExam,setFilterExam]=useState("");
  const [filterSubject,setFilterSubject]=useState("");
  const [filterTeacher,setFilterTeacher]=useState("");
  const [filterCourse,setFilterCourse]=useState("");

  const blank={studentId:"",examName:"",examType:"",subject:"",teacherId:"",totalMarks:"",score:"",grade:"",date:today(),notes:""};
  const [form,setForm]=useState(blank);
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  const allCourses=[...new Set(students.map(s=>s.course).filter(Boolean))];
  const allSubjects=settings.subjects||[];
  const allExamNames=[...new Set(results.map(r=>r.examName).filter(Boolean))];
  const EXAM_TYPES=["Class Test","Mock Exam","Term Final","Monthly Test","Unit Test","Practice Paper","Board Mock","Other"];

  const filtered=results.filter(r=>{
    const st=students.find(s=>s.id===r.studentId);
    const matchStudent=!viewStudentId||r.studentId===viewStudentId;
    const matchExam=!filterExam||r.examName===filterExam;
    const matchSubject=!filterSubject||r.subject===filterSubject;
    const matchTeacher=!filterTeacher||r.teacherId===filterTeacher;
    const matchCourse=!filterCourse||(st?.course||"")===filterCourse;
    return matchStudent&&matchExam&&matchSubject&&matchTeacher&&matchCourse;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  function openAdd(){setEditId(null);setForm({...blank});setModal(true);}
  function openEdit(r){setEditId(r.id);setForm({...r});setModal(true);}

  function save(){
    if(!form.studentId)return alert("Select a student.");
    if(!form.examName.trim())return alert("Exam name is required.");
    if(!form.subject)return alert("Subject is required.");
    if(!form.totalMarks||!form.score)return alert("Total marks and score are required.");
    if(+form.score>+form.totalMarks)return alert("Score cannot exceed total marks.");
    const grade=form.grade||autoGrade(form.score,form.totalMarks);
    const rec={...form,grade,score:+form.score,totalMarks:+form.totalMarks};
    if(editId)setResults(p=>p.map(r=>r.id===editId?{...rec,id:editId}:r));
    else setResults(p=>[...p,{...rec,id:uid()}]);
    setModal(false);
  }

  function del(id){if(!window.confirm("Delete this result?"))return;setResults(p=>p.filter(r=>r.id!==id));}

  const GRADE_COLOR={
    "A+":"green","A":"green","B+":"teal","B":"blue","C":"amber","D":"amber","F":"red","":" gray"
  };

  function handlePrint(){
    const rows=filtered.map(r=>{
      const st=students.find(s=>s.id===r.studentId);
      const t=teachers.find(t=>t.id===r.teacherId);
      const pct=r.totalMarks?(((r.score||0)/r.totalMarks)*100).toFixed(1)+"%":"—";
      return `<tr>
        <td>${r.date}</td>
        <td><b>${st?.name||"—"}</b> ${st?.studentId?"("+st.studentId+")":""}</td>
        <td>${st?.course||"—"}</td>
        <td>${r.examName}</td>
        <td>${r.examType||"—"}</td>
        <td>${r.subject||"—"}</td>
        <td>${t?.name||"—"}</td>
        <td>${r.score}/${r.totalMarks} (${pct})</td>
        <td><span class="badge badge-${r.grade==="A+"||r.grade==="A"?"green":r.grade==="F"?"red":"amber"}">${r.grade||"—"}</span></td>
      </tr>`;
    }).join("");
    printContent("Exam Results",`
      <p style="font-size:12px;color:#6b7280;margin-bottom:12px;">Showing ${filtered.length} result(s)</p>
      <table><thead><tr><th>Date</th><th>Student</th><th>Course</th><th>Exam</th><th>Type</th><th>Subject</th><th>Teacher</th><th>Score</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Exam Results" sub="Record and track student results across all exams" action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={openAdd} color="purple">+ Add Result</Btn></div>}/>

    {/* Filters */}
    <Card style={{padding:14,marginBottom:14}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <select value={viewStudentId} onChange={e=>setViewStudentId(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Students</option>{students.map(s=><option key={s.id} value={s.id}>{s.name} {s.studentId?"("+s.studentId+")":""}</option>)}</select>
        <select value={filterCourse} onChange={e=>setFilterCourse(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Courses</option>{allCourses.map(c=><option key={c} value={c}>{c}</option>)}</select>
        <select value={filterSubject} onChange={e=>setFilterSubject(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Subjects</option>{allSubjects.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <select value={filterTeacher} onChange={e=>setFilterTeacher(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Teachers</option>{teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
        <select value={filterExam} onChange={e=>setFilterExam(e.target.value)} style={{...IS,fontSize:12}}><option value="">All Exams</option>{allExamNames.map(e=><option key={e} value={e}>{e}</option>)}</select>
      </div>
      {(viewStudentId||filterCourse||filterSubject||filterTeacher||filterExam)&&<button onClick={()=>{setViewStudentId("");setFilterCourse("");setFilterSubject("");setFilterTeacher("");setFilterExam("");}} style={{fontSize:11,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>✕ Clear filters</button>}
    </Card>

    {/* Summary cards */}
    {filtered.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
      <StatCard label="Results" value={filtered.length} icon="📋" from={PU} to="#6d28d9"/>
      <StatCard label="Avg Score %" value={(filtered.filter(r=>r.totalMarks).reduce((s,r)=>s+(r.score/r.totalMarks)*100,0)/filtered.filter(r=>r.totalMarks).length||0).toFixed(1)+"%"} icon="📊" from={TE} to="#0f766e"/>
      <StatCard label="A/A+ Grades" value={filtered.filter(r=>r.grade==="A+"||r.grade==="A").length} icon="🏆" from={GR} to="#047857"/>
      <StatCard label="Failing" value={filtered.filter(r=>r.grade==="F").length} icon="⚠️" from={RE} to="#b91c1c"/>
    </div>}

    {filtered.length===0?<Empty icon="📋" msg="No results found."/>
    :<div style={{display:"flex",flexDirection:"column",gap:8}}>
      {filtered.map(r=>{
        const st=students.find(s=>s.id===r.studentId);
        const t=teachers.find(t=>t.id===r.teacherId);
        const pct=r.totalMarks?((r.score||0)/r.totalMarks*100).toFixed(1):"—";
        const gc=GRADE_COLOR[r.grade||""]||"gray";
        return <Card key={r.id} style={{padding:14,borderLeft:`4px solid ${r.grade==="A+"||r.grade==="A"?GR:r.grade==="F"?RE:r.grade==="B+"||r.grade==="B"?TE:AM}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:3}}>
                <span style={{fontWeight:800,color:N,fontSize:13}}>{st?.name||"Unknown Student"}</span>
                {st?.studentId&&<Badge color="navy">{st.studentId}</Badge>}
                {st?.course&&<Badge color="purple">{st.course}</Badge>}
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:3}}>
                <Badge color="purple">{r.examName}</Badge>
                {r.examType&&<Badge color="gray">{r.examType}</Badge>}
                {r.subject&&<Badge color="blue">{r.subject}</Badge>}
                {t&&<span style={{fontSize:11,color:"#6b7280"}}>· {t.name}</span>}
              </div>
              <div style={{fontSize:11,color:"#9ca3af"}}>{r.date}{r.notes?` · ${r.notes}`:""}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontWeight:800,color:N,fontSize:16}}>{r.score}<span style={{fontSize:11,fontWeight:600,color:"#9ca3af"}}>/{r.totalMarks}</span></div>
              <div style={{fontSize:11,color:"#9ca3af"}}>{pct}%</div>
              {r.grade&&<div style={{marginTop:3}}><Badge color={gc}>{r.grade}</Badge></div>}
            </div>
          </div>
          <HR/>
          <div style={{display:"flex",gap:14}}>
            <button onClick={()=>openEdit(r)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
            <button onClick={()=>del(r.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
          </div>
        </Card>;
      })}
    </div>}

    {modal&&<Modal title={editId?"Edit Result":"Add Exam Result"} onClose={()=>setModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <div style={{gridColumn:"1/-1"}}>
          <FSel label="Student" req options={students.map(s=>({value:s.id,label:`${s.name}${s.studentId?` (${s.studentId})`:""}`}))} value={form.studentId} onChange={e=>sf("studentId",e.target.value)}/>
        </div>
        <FI label="Exam Name" req value={form.examName} onChange={e=>sf("examName",e.target.value)} placeholder="e.g. Mid-Term 2025, Monthly Test May"/>
        <FSel label="Exam Type" req options={EXAM_TYPES} value={form.examType} onChange={e=>sf("examType",e.target.value)}/>
        <FSel label="Subject" req options={allSubjects} value={form.subject} onChange={e=>sf("subject",e.target.value)}/>
        <FSel label="Teacher (optional)" options={teachers.map(t=>({value:t.id,label:t.name}))} value={form.teacherId} onChange={e=>sf("teacherId",e.target.value)}/>
        <FI label="Total Marks" req type="number" value={form.totalMarks} onChange={e=>{sf("totalMarks",e.target.value);sf("grade",autoGrade(form.score,e.target.value));}} placeholder="e.g. 100"/>
        <FI label="Score Obtained" req type="number" value={form.score} onChange={e=>{sf("score",e.target.value);sf("grade",autoGrade(e.target.value,form.totalMarks));}} placeholder="e.g. 78"/>
        <FI label="Date" req type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
        <div style={{marginBottom:14}}>
          <FL label="Grade"/>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {GRADE_BOUNDARIES.map(b=><button key={b.grade} type="button" onClick={()=>sf("grade",b.grade)} style={{padding:"5px 10px",borderRadius:7,border:`1.5px solid ${form.grade===b.grade?N:"#e5e7eb"}`,background:form.grade===b.grade?N:"#fff",color:form.grade===b.grade?"#fff":"#6b7280",fontSize:12,fontWeight:700}}>{b.grade}</button>)}
          </div>
          {form.score&&form.totalMarks&&<p style={{fontSize:11,color:"#9ca3af",marginTop:4}}>Auto-grade: <b>{autoGrade(form.score,form.totalMarks)}</b> ({((+form.score/+form.totalMarks)*100).toFixed(1)}%)</p>}
        </div>
      </div>
      <FTA label="Notes (optional)" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10,marginTop:6}}><Btn onClick={save} color="purple" style={{flex:1}}>{editId?"Update Result":"Add Result"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
  </div>;
}

// ── SIDE INCOME ───────────────────────────────────────────────────
function SideIncome({sideIncome,setSideIncome,students,settings}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);const [filterM,setFilterM]=useState(thisMonth());
  const blank={type:"",lineItems:[{id:uid(),subject:"",category:"",amount:""}],studentId:"",date:today(),paymentMethod:"",notes:""};
  const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<18;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);
  const filtered=[...sideIncome].filter(r=>!filterM||r.date?.startsWith(filterM)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const total=filtered.reduce((s,r)=>s+(+r.totalAmount||0),0);
  const mTotal=sideIncome.filter(r=>r.date?.startsWith(thisMonth())).reduce((s,r)=>s+(+r.totalAmount||0),0);
  function addLine(){sf("lineItems",[...form.lineItems,{id:uid(),subject:"",category:"",amount:""}]);}
  function removeLine(id){if(form.lineItems.length===1)return;sf("lineItems",form.lineItems.filter(l=>l.id!==id));}
  function updateLine(id,k,v){sf("lineItems",form.lineItems.map(l=>l.id===id?{...l,[k]:v}:l));}
  function openAdd(){setEditId(null);setForm({...blank,lineItems:[{id:uid(),subject:"",category:"",amount:""}]});setModal(true);}
  function openEdit(r){setEditId(r.id);setForm({...blank,...r,lineItems:r.lineItems||[{id:uid(),subject:"",category:"",amount:String(r.totalAmount||"")}]});setModal(true);}
  function save(){
    if(!form.type)return alert("Income type is required.");
    const lineItems=form.lineItems.filter(l=>l.amount);
    if(!lineItems.length)return alert("Add at least one item with an amount.");
    const totalAmount=lineItems.reduce((s,l)=>s+(+l.amount||0),0);
    const rec={...form,lineItems,totalAmount};
    if(editId)setSideIncome(p=>p.map(r=>r.id===editId?{...rec,id:editId}:r));
    else setSideIncome(p=>[...p,{...rec,id:uid()}]);
    setModal(false);
  }
  function del(id){if(!window.confirm("Delete?"))return;setSideIncome(p=>p.filter(r=>r.id!==id));}
  const FEE_CATS=["Admission Fee","Lab Fee","Book Fee","Mock Test Fee","Registration Fee","Exam Fee","Material Fee","Other"];

  function handlePrint(){
    const rows=filtered.map(r=>{const st=students.find(s=>s.id===r.studentId);return `<tr><td>${r.date}</td><td>${r.type}</td><td>${st?.name||"—"}</td><td>${(r.lineItems||[]).filter(l=>l.amount).map(l=>`${l.category||""}${l.subject?" ("+l.subject+")":""}: ${fmt(l.amount)}`).join("; ")}</td><td><b>${fmt(r.totalAmount)}</b></td><td>${r.paymentMethod||"—"}</td></tr>`;}).join("");
    printContent("Side Income",`<table><thead><tr><th>Date</th><th>Type</th><th>Student</th><th>Items</th><th>Total</th><th>Method</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4" style="text-align:right;font-weight:800;">Total</td><td><b>${fmt(total)}</b></td><td></td></tr></tfoot></table>`);
  }

  return <div>
    <SHdr title="Side Income" sub="Admission fees, lab fees, book fees — separate from monthly fees" action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={openAdd} color="purple">+ Add Income</Btn></div>}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      <StatCard label="This Month" value={fmt(mTotal)} icon="💡" from={PU} to="#6d28d9"/>
      <StatCard label={filterM?mLabel(filterM)+" Total":"All Time"} value={fmt(total)} icon="📊" from={N} to="#1e3a8a"/>
    </div>
    <select value={filterM} onChange={e=>setFilterM(e.target.value)} style={{...IS,marginBottom:14}}><option value="">All Time</option>{monthOpts.map(m=><option key={m} value={m}>{mLabel(m)}</option>)}</select>
    {filtered.length===0?<Empty icon="💡" msg="No side income records yet."/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>{filtered.map(r=>{const st=students.find(s=>s.id===r.studentId);return <Card key={r.id} style={{padding:14,borderLeft:"4px solid #7c3aed"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div>
          <div style={{fontWeight:800,color:N,fontSize:13}}>{r.type}</div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{r.date}{r.paymentMethod?` · ${r.paymentMethod}`:""}{st?` · ${st.name}`:""}</div>
          {(r.lineItems||[]).filter(l=>l.amount).map(l=><div key={l.id} style={{fontSize:11,color:"#6b7280",marginTop:3}}>• {l.category||"Item"}{l.subject?` (${l.subject})`:""}: {fmt(l.amount)}</div>)}
        </div>
        <div style={{fontWeight:800,color:PU,fontSize:14,flexShrink:0}}>{fmt(r.totalAmount)}</div>
      </div>
      <HR/>
      <div style={{display:"flex",gap:14}}>
        <button onClick={()=>openEdit(r)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
        <button onClick={()=>del(r.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
      </div>
    </Card>;})}
    </div>}
    {modal&&<Modal title={editId?"Edit Income":"Add Side Income"} onClose={()=>setModal(false)} wide>
      <FSel label="Income Type" req options={["Admission Fee","Lab Fee","Book Fee","Mock Test Fee","Registration Fee","Exam Fee","Material Fee","Other"]} value={form.type} onChange={e=>sf("type",e.target.value)}/>
      <FSel label="Student (optional)" options={students.map(s=>({value:s.id,label:`${s.name}${s.studentId?` (${s.studentId})`:""}`}))} value={form.studentId} onChange={e=>sf("studentId",e.target.value)}/>
      <div style={{marginBottom:14}}>
        <FL label="Fee Items"/>
        <div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden",marginBottom:8}}>
          {form.lineItems.map((l,i)=><div key={l.id} style={{display:"flex",gap:6,padding:"8px 10px",borderBottom:i<form.lineItems.length-1?"1px solid #f5f5f5":"none",alignItems:"center",flexWrap:"wrap"}}>
            <select value={l.category} onChange={e=>updateLine(l.id,"category",e.target.value)} style={{...IS,flex:2,minWidth:100,fontSize:12}}><option value="">Category</option>{FEE_CATS.map(c=><option key={c} value={c}>{c}</option>)}</select>
            <select value={l.subject} onChange={e=>updateLine(l.id,"subject",e.target.value)} style={{...IS,flex:2,minWidth:90,fontSize:12}}><option value="">Subject</option>{(settings.subjects||[]).map(s=><option key={s} value={s}>{s}</option>)}</select>
            <input type="number" value={l.amount} onChange={e=>updateLine(l.id,"amount",e.target.value)} placeholder="৳ Amount" style={{...IS,flex:1,minWidth:80,fontSize:12}} onFocus={focusIn} onBlur={focusOut}/>
            {form.lineItems.length>1&&<button onClick={()=>removeLine(l.id)} style={{background:"none",border:"none",color:"#fca5a5",fontSize:18,fontWeight:700,cursor:"pointer",lineHeight:1,flexShrink:0}}>×</button>}
          </div>)}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <button onClick={addLine} style={{fontSize:12,fontWeight:700,color:PU,background:"none",border:"none",cursor:"pointer"}}>+ Add Another Item</button>
          <span style={{fontSize:13,fontWeight:700,color:N}}>Total: {fmt(form.lineItems.reduce((s,l)=>s+(+l.amount||0),0))}</span>
        </div>
      </div>
      <FI label="Date" req type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
      {(settings.paymentMethods||[]).length>0?<FSel label="Payment Method" options={settings.paymentMethods} value={form.paymentMethod} onChange={e=>sf("paymentMethod",e.target.value)}/>:<FI label="Payment Method" value={form.paymentMethod} onChange={e=>sf("paymentMethod",e.target.value)} placeholder="e.g. Cash"/>}
      <FTA label="Notes (optional)" value={form.notes} onChange={e=>sf("notes",e.target.value)}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={save} color="purple" style={{flex:1}}>{editId?"Update":"Add Income"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
  </div>;
}

// ── EXPENSES ──────────────────────────────────────────────────────
function Expenses({expenses,setExpenses,settings}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);const [filterM,setFilterM]=useState(thisMonth());
  const blank={category:"",description:"",amount:"",date:today(),notes:""};const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const monthOpts=useMemo(()=>{const o=[];const d=new Date();for(let i=0;i<18;i++){o.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);d.setMonth(d.getMonth()-1);}return o;},[]);
  const filtered=[...expenses].filter(r=>!filterM||r.date?.startsWith(filterM)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const total=filtered.reduce((s,r)=>s+(+r.amount||0),0);
  const mTotal=expenses.filter(r=>r.date?.startsWith(thisMonth())).reduce((s,r)=>s+(+r.amount||0),0);
  const byCat={};filtered.forEach(r=>{const c=r.category||"Uncategorised";byCat[c]=(byCat[c]||0)+(+r.amount||0);});
  function openAdd(){setEditId(null);setForm({...blank});setModal(true);}
  function openEdit(r){setEditId(r.id);setForm({...r});setModal(true);}
  function save(){if(!form.amount)return alert("Amount required.");if(editId)setExpenses(p=>p.map(r=>r.id===editId?{...form,id:editId,amount:+form.amount}:r));else setExpenses(p=>[...p,{...form,id:uid(),amount:+form.amount}]);setModal(false);}
  function del(id){if(!window.confirm("Delete?"))return;setExpenses(p=>p.filter(r=>r.id!==id));}

  function handlePrint(){
    const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`<tr><td>${cat}</td><td><b>${fmt(amt)}</b></td></tr>`).join("");
    const rows=filtered.map(r=>`<tr><td>${r.date}</td><td><b>${r.category||"—"}</b></td><td>${r.description||"—"}</td><td>${fmt(r.amount)}</td><td>${r.notes||"—"}</td></tr>`).join("");
    printContent("Expenses",`
      <h2>By Category</h2><table><thead><tr><th>Category</th><th>Total</th></tr></thead><tbody>${catRows}<tr><td><b>GRAND TOTAL</b></td><td><b>${fmt(total)}</b></td></tr></tbody></table>
      <h2>All Expenses</h2><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  return <div>
    <SHdr title="Expenses" sub="Track all coaching expenses" action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print</Btn><Btn onClick={openAdd} color="red">+ Add Expense</Btn></div>}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      <StatCard label="This Month" value={fmt(mTotal)} icon="📤" from={RE} to="#b91c1c"/>
      <StatCard label={filterM?mLabel(filterM)+" Total":"All Time"} value={fmt(total)} icon="📊" from="#374151" to="#111827"/>
    </div>
    <select value={filterM} onChange={e=>setFilterM(e.target.value)} style={{...IS,marginBottom:14}}><option value="">All Time</option>{monthOpts.map(m=><option key={m} value={m}>{mLabel(m)}</option>)}</select>
    {Object.keys(byCat).length>0&&<Card style={{padding:14,marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>By Category</p>
      {Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=><div key={cat} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid #f9fafb"}}>
        <span style={{fontSize:13,fontWeight:600,color:"#374151"}}>{cat}</span><Badge color="red">{fmt(amt)}</Badge>
      </div>)}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0"}}><span style={{fontSize:13,fontWeight:800,color:N}}>Total</span><span style={{fontWeight:800,color:RE,fontSize:14}}>{fmt(total)}</span></div>
    </Card>}
    {filtered.length===0?<Empty icon="📤" msg="No expenses recorded."/>
    :<div style={{display:"flex",flexDirection:"column",gap:8}}>{filtered.map(r=><Card key={r.id} style={{padding:14,borderLeft:"4px solid #ef4444"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>

// ── EVENTS ────────────────────────────────────────────────────────
function Events({events,setEvents,students}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);const [viewId,setViewId]=useState(null);
  const [payModal,setPayModal]=useState(false);const [expModal,setExpModal]=useState(false);
  const blank={name:"",date:today(),description:"",studentPayments:[],eventExpenses:[]};const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const [pForm,setPForm]=useState({studentId:"",amount:"",notes:""});
  const [eForm,setEForm]=useState({description:"",amount:"",notes:""});
  const ve=events.find(e=>e.id===viewId);

  function openAdd(){setEditId(null);setForm({...blank,studentPayments:[],eventExpenses:[]});setModal(true);}
  function openEdit(ev){setEditId(ev.id);setForm({...ev});setModal(true);}
  function save(){if(!form.name.trim())return alert("Event name required.");if(editId)setEvents(p=>p.map(e=>e.id===editId?{...form,id:editId}:e));else setEvents(p=>[...p,{...form,id:uid()}]);setModal(false);}
  function del(id){if(!window.confirm("Delete this event?"))return;setEvents(p=>p.filter(e=>e.id!==id));}
  function addStudentPay(evId){if(!pForm.studentId||!pForm.amount)return alert("Student and amount required.");setEvents(p=>p.map(e=>e.id!==evId?e:{...e,studentPayments:[...(e.studentPayments||[]),{id:uid(),...pForm,amount:+pForm.amount}]}));setPForm({studentId:"",amount:"",notes:""});setPayModal(false);}
  function removeStudentPay(evId,pid){setEvents(p=>p.map(e=>e.id!==evId?e:{...e,studentPayments:(e.studentPayments||[]).filter(x=>x.id!==pid)}));}
  function addEvExp(evId){if(!eForm.amount)return alert("Amount required.");setEvents(p=>p.map(e=>e.id!==evId?e:{...e,eventExpenses:[...(e.eventExpenses||[]),{id:uid(),...eForm,amount:+eForm.amount}]}));setEForm({description:"",amount:"",notes:""});setExpModal(false);}
  function removeEvExp(evId,eid){setEvents(p=>p.map(e=>e.id!==evId?e:{...e,eventExpenses:(e.eventExpenses||[]).filter(x=>x.id!==eid)}));}

  function handlePrintEvent(ev){
    const inc=(ev.studentPayments||[]).reduce((s,p)=>s+(+p.amount||0),0);
    const exp=(ev.eventExpenses||[]).reduce((s,e)=>s+(+e.amount||0),0);
    const payRows=(ev.studentPayments||[]).map(p=>{const st=students.find(s=>s.id===p.studentId);return `<tr><td>${st?.name||"—"}</td><td>${fmt(p.amount)}</td><td>${p.notes||"—"}</td></tr>`;}).join("");
    const expRows=(ev.eventExpenses||[]).map(e=>`<tr><td>${e.description||"—"}</td><td>${fmt(e.amount)}</td><td>${e.notes||"—"}</td></tr>`).join("");
    printContent(`Event — ${ev.name}`,`
      <div class="card"><h3>${ev.name}</h3><p style="font-size:12px;color:#6b7280;">${ev.date}${ev.description?" · "+ev.description:""}</p>
      <div class="detail-grid" style="margin-top:10px;">
        <div class="detail-item"><div class="lbl">Collected</div><div class="val">${fmt(inc)}</div></div>
        <div class="detail-item"><div class="lbl">Expenses</div><div class="val">${fmt(exp)}</div></div>
        <div class="detail-item"><div class="lbl">Net</div><div class="val">${fmt(inc-exp)}</div></div>
        <div class="detail-item"><div class="lbl">Students</div><div class="val">${(ev.studentPayments||[]).length}</div></div>
      </div></div>
      ${payRows?`<h2>Student Payments</h2><table><thead><tr><th>Student</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${payRows}</tbody></table>`:""}
      ${expRows?`<h2>Event Expenses</h2><table><thead><tr><th>Description</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${expRows}</tbody></table>`:""}`);
  }

  return <div>
    <SHdr title="Events" sub="Track per-event student collections and expenses" action={<Btn onClick={openAdd} color="teal">+ Add Event</Btn>}/>
    {events.length===0?<Empty icon="🎉" msg="No events yet."/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>{[...events].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(ev=>{
      const inc=(ev.studentPayments||[]).reduce((s,p)=>s+(+p.amount||0),0);
      const exp=(ev.eventExpenses||[]).reduce((s,e)=>s+(+e.amount||0),0);
      const net=inc-exp;
      return <Card key={ev.id} style={{padding:14}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
          <div><div style={{fontWeight:800,color:N,fontSize:14}}>{ev.name}</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{ev.date}{ev.description?` · ${ev.description}`:""}</div>
            <div style={{display:"flex",gap:12,marginTop:7,flexWrap:"wrap"}}>
              <span style={{fontSize:12}}><span style={{color:"#9ca3af"}}>Collected: </span><b style={{color:GR}}>{fmt(inc)}</b></span>
              <span style={{fontSize:12}}><span style={{color:"#9ca3af"}}>Spent: </span><b style={{color:RE}}>{fmt(exp)}</b></span>
              <span style={{fontSize:12}}><span style={{color:"#9ca3af"}}>Net: </span><b style={{color:net>=0?GR:RE}}>{fmt(net)}</b></span>
            </div>
          </div>
          <Badge color={net>=0?"green":"red"}>{(ev.studentPayments||[]).length} students</Badge>
        </div>
        <HR/>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          <button onClick={()=>setViewId(ev.id)} style={{fontSize:12,fontWeight:700,color:N,background:"none",border:"none",cursor:"pointer"}}>View Details</button>
          <button onClick={()=>handlePrintEvent(ev)} style={{fontSize:12,fontWeight:700,color:"#9ca3af",background:"none",border:"none",cursor:"pointer"}}>🖨 Print</button>
          <button onClick={()=>openEdit(ev)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
          <button onClick={()=>del(ev.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
        </div>
      </Card>;})}
    </div>}
    {modal&&<Modal title={editId?"Edit Event":"Add Event"} onClose={()=>setModal(false)}>
      <FI label="Event Name" req value={form.name} onChange={e=>sf("name",e.target.value)} placeholder="e.g. Annual Sports Day"/>
      <FI label="Event Date" req type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
      <FTA label="Description (optional)" value={form.description} onChange={e=>sf("description",e.target.value)}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={save} color="teal" style={{flex:1}}>{editId?"Update":"Create Event"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
    {ve&&<Modal title={ve.name} onClose={()=>setViewId(null)} wide>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}><Btn onClick={()=>handlePrintEvent(ve)} color="ghost" style={{fontSize:12}}>🖨 Print Event</Btn></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
        {[["Collected",fmt((ve.studentPayments||[]).reduce((s,p)=>s+(+p.amount||0),0)),"green"],["Spent",fmt((ve.eventExpenses||[]).reduce((s,e)=>s+(+e.amount||0),0)),"red"],["Net",fmt((ve.studentPayments||[]).reduce((s,p)=>s+(+p.amount||0),0)-(ve.eventExpenses||[]).reduce((s,e)=>s+(+e.amount||0),0)),(ve.studentPayments||[]).reduce((s,p)=>s+(+p.amount||0),0)>=(ve.eventExpenses||[]).reduce((s,e)=>s+(+e.amount||0),0)?"green":"red"]].map(([l,v,c])=>(
          <div key={l} style={{background:"#f9fafb",borderRadius:10,padding:10,textAlign:"center"}}><div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</div><div style={{fontWeight:800,fontSize:16,color:c==="green"?GR:RE,marginTop:3}}>{v}</div></div>))}
      </div>
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",margin:0}}>Student Payments</p>
          <Btn onClick={()=>{setPForm({studentId:"",amount:"",notes:""});setPayModal(ve.id);}} color="green" style={{padding:"5px 10px",fontSize:11}}>+ Add Payment</Btn>
        </div>
        {!(ve.studentPayments||[]).length?<p style={{fontSize:12,color:"#9ca3af"}}>No payments yet.</p>
        :<div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden"}}>{ve.studentPayments.map((p,i)=>{const st=students.find(s=>s.id===p.studentId);return <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<ve.studentPayments.length-1?"1px solid #f5f5f5":"none"}}>
          <div><span style={{fontWeight:600,fontSize:12,color:"#1f2937"}}>{st?.name||"Unknown"}</span>{p.notes&&<span style={{fontSize:11,color:"#9ca3af",marginLeft:6}}>· {p.notes}</span>}</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}><Badge color="green">{fmt(p.amount)}</Badge><button onClick={()=>removeStudentPay(ve.id,p.id)} style={{background:"none",border:"none",color:"#fca5a5",fontSize:16,fontWeight:700,cursor:"pointer"}}>×</button></div>
        </div>;})}
        </div>}
      </div>
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.06em",margin:0}}>Event Expenses</p>
          <Btn onClick={()=>{setEForm({description:"",amount:"",notes:""});setExpModal(ve.id);}} color="red" style={{padding:"5px 10px",fontSize:11}}>+ Add Expense</Btn>
        </div>
        {!(ve.eventExpenses||[]).length?<p style={{fontSize:12,color:"#9ca3af"}}>No expenses yet.</p>
        :<div style={{border:"1.5px solid #e5e7eb",borderRadius:10,overflow:"hidden"}}>{ve.eventExpenses.map((e,i)=><div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<ve.eventExpenses.length-1?"1px solid #f5f5f5":"none"}}>
          <div><span style={{fontWeight:600,fontSize:12,color:"#1f2937"}}>{e.description||"Expense"}</span>{e.notes&&<span style={{fontSize:11,color:"#9ca3af",marginLeft:6}}>· {e.notes}</span>}</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}><Badge color="red">{fmt(e.amount)}</Badge><button onClick={()=>removeEvExp(ve.id,e.id)} style={{background:"none",border:"none",color:"#fca5a5",fontSize:16,fontWeight:700,cursor:"pointer"}}>×</button></div>
        </div>)}
        </div>}
      </div>
    </Modal>}
    {payModal&&<Modal title="Add Student Payment" onClose={()=>setPayModal(false)}>
      <FSel label="Student" req options={students.map(s=>({value:s.id,label:`${s.name}${s.studentId?` (${s.studentId})`:""}`}))} value={pForm.studentId} onChange={e=>setPForm(p=>({...p,studentId:e.target.value}))}/>
      <FI label="Amount (৳)" req type="number" value={pForm.amount} onChange={e=>setPForm(p=>({...p,amount:e.target.value}))}/>
      <FTA label="Notes (optional)" value={pForm.notes} onChange={e=>setPForm(p=>({...p,notes:e.target.value}))}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={()=>addStudentPay(payModal)} color="green" style={{flex:1}}>Add Payment</Btn><Btn onClick={()=>setPayModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
    {expModal&&<Modal title="Add Event Expense" onClose={()=>setExpModal(false)}>
      <FI label="Description" req value={eForm.description} onChange={e=>setEForm(p=>({...p,description:e.target.value}))} placeholder="e.g. Decoration, Sound System"/>
      <FI label="Amount (৳)" req type="number" value={eForm.amount} onChange={e=>setEForm(p=>({...p,amount:e.target.value}))}/>
      <FTA label="Notes (optional)" value={eForm.notes} onChange={e=>setEForm(p=>({...p,notes:e.target.value}))}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={()=>addEvExp(expModal)} color="red" style={{flex:1}}>Add Expense</Btn><Btn onClick={()=>setExpModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
  </div>;
}

// ── NOTICES ───────────────────────────────────────────────────────
function Notices({notices,setNotices}){
  const [modal,setModal]=useState(false);const [editId,setEditId]=useState(null);
  const blank={title:"",body:"",date:today(),type:""};const [form,setForm]=useState(blank);const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const TYPES=["General","Fee Reminder","Holiday","Exam","Event","Urgent"];
  const CM={General:"gray","Fee Reminder":"amber",Holiday:"green",Exam:"navy",Event:"teal",Urgent:"red"};
  function openAdd(){setEditId(null);setForm(blank);setModal(true);}
  function openEdit(n){setEditId(n.id);setForm({...n});setModal(true);}
  function save(){if(!form.title.trim()||!form.body.trim())return alert("Title and content required.");if(editId)setNotices(p=>p.map(n=>n.id===editId?{...form,id:editId}:n));else setNotices(p=>[{...form,id:uid()},...p]);setModal(false);}
  function del(id){if(!window.confirm("Delete?"))return;setNotices(p=>p.filter(r=>r.id!==id));}
  function handlePrint(){
    const html=notices.map(n=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><h3>${n.title}</h3>${n.type?`<span class="badge badge-blue">${n.type}</span>`:""}</div><p style="font-size:12px;line-height:1.6;color:#374151;">${n.body}</p><p style="font-size:10px;color:#9ca3af;margin-top:6px;">${n.date}</p></div>`).join("");
    printContent("Notices",html);
  }
  return <div>
    <SHdr title="Notices" sub="Internal notices and reminders" action={<div style={{display:"flex",gap:8}}><Btn onClick={handlePrint} color="ghost" style={{fontSize:12}}>🖨 Print All</Btn><Btn onClick={openAdd} color="teal">+ Add Notice</Btn></div>}/>
    {notices.length===0?<Empty icon="📌" msg="No notices yet."/>
    :<div style={{display:"flex",flexDirection:"column",gap:10}}>{notices.map(n=><Card key={n.id} style={{padding:14}}>
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}}><span style={{fontWeight:800,color:N,fontSize:14}}>{n.title}</span>{n.type&&<Badge color={CM[n.type]||"gray"}>{n.type}</Badge>}</div>
      <p style={{fontSize:13,color:"#4b5563",lineHeight:1.6,margin:0}}>{n.body}</p>
      <div style={{fontSize:11,color:"#9ca3af",marginTop:5}}>{n.date}</div>
      <HR/>
      <div style={{display:"flex",gap:14}}>
        <button onClick={()=>openEdit(n)} style={{fontSize:12,fontWeight:700,color:TE,background:"none",border:"none",cursor:"pointer"}}>Edit</button>
        <button onClick={()=>del(n.id)} style={{fontSize:12,fontWeight:700,color:RE,background:"none",border:"none",cursor:"pointer"}}>Delete</button>
      </div>
    </Card>)}
    </div>}
    {modal&&<Modal title={editId?"Edit Notice":"Add Notice"} onClose={()=>setModal(false)}>
      <FI label="Title" req value={form.title} onChange={e=>sf("title",e.target.value)}/>
      <FSel label="Type (optional)" options={TYPES} value={form.type} onChange={e=>sf("type",e.target.value)}/>
      <FI label="Date" type="date" value={form.date} onChange={e=>sf("date",e.target.value)}/>
      <FTA label="Content" req value={form.body} onChange={e=>sf("body",e.target.value)} rows={4}/>
      <div style={{display:"flex",gap:10}}><Btn onClick={save} color="teal" style={{flex:1}}>{editId?"Update":"Add"}</Btn><Btn onClick={()=>setModal(false)} color="ghost">Cancel</Btn></div>
    </Modal>}
  </div>;
}

  const setResults     =useCallback(fn=>{setResultsR(prev=>{const next=typeof fn==="function"?fn(prev):fn;dbSet("ae_results",next);return next;});},[]);

  if(loading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0c1445,#0f1e6b)"}}>
    <div style={{textAlign:"center"}}>
      <div style={{fontSize:44,fontWeight:900,color:"#fff",fontFamily:"'Playfair Display',serif",letterSpacing:"-1px"}}>ARDENT</div>
      <div style={{color:"#fbbf24",letterSpacing:"0.3em",fontSize:12,fontWeight:700,textTransform:"uppercase",marginTop:4}}>Education</div>
      <div style={{display:"flex",gap:5,justifyContent:"center",marginTop:24}}>{[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:"#fbbf24",animation:"bounce 1s infinite",animationDelay:`${i*0.15}s`}}/>)}</div>
    </div>
  </div>;

  const needsSetup=!settings.classStart;

  return <div className="app-layout" style={{minHeight:"100vh",display:"flex",background:"#f0f2f8"}}>
    <aside className={`sidebar${sidebar?" open":""}`} style={{width:230,background:"#0c1445",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"24px 18px 18px",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
        <div style={{fontSize:10,fontWeight:700,color:"rgba(251,191,36,0.6)",textTransform:"uppercase",letterSpacing:"0.35em",marginBottom:8}}>Admin Portal</div>
        <div style={{fontSize:24,fontWeight:900,color:"#fff",fontFamily:"'Playfair Display',serif",lineHeight:1}}>ARDENT</div>
        <div style={{display:"flex",alignItems:"center",gap:7,marginTop:7}}>
          <div style={{flex:1,height:1,background:"rgba(251,191,36,0.3)"}}/>
          <div style={{fontSize:9,fontWeight:700,color:"#fbbf24",textTransform:"uppercase",letterSpacing:"0.2em"}}>Education</div>
          <div style={{flex:1,height:1,background:"rgba(251,191,36,0.3)"}}/>
        </div>
      </div>
      <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
        {NAV.map(n=><button key={n.id} onClick={()=>{setPage(n.id);setSidebar(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"8px 11px",borderRadius:10,border:"none",cursor:"pointer",fontSize:12,textAlign:"left",marginBottom:1,...(page===n.id?{background:"#fbbf24",color:"#0c1445",fontWeight:800}:{background:"transparent",color:"#c7d2fe",fontWeight:600})}}>
          <span>{n.icon}</span><span style={{flex:1}}>{n.label}</span>
          {n.id==="settings"&&needsSetup&&<span style={{width:6,height:6,borderRadius:"50%",background:"#f87171",flexShrink:0}}/>}
        </button>)}
      </nav>
      <div style={{padding:"10px 18px",borderTop:"1px solid rgba(255,255,255,0.08)",fontSize:10,color:"rgba(255,255,255,0.35)",fontWeight:600}}>Data saved automatically</div>
    </aside>

    {sidebar&&<div className="overlay show" onClick={()=>setSidebar(false)}/>}

    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>
      <header className="mobile-header" style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"11px 14px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:20,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <button onClick={()=>setSidebar(true)} style={{fontSize:20,fontWeight:900,color:N,background:"none",border:"none",cursor:"pointer"}}>☰</button>
        <span style={{fontWeight:800,fontSize:17,color:N,fontFamily:"'Playfair Display',serif"}}>ARDENT Education</span>
      </header>
      <main style={{flex:1,overflowY:"auto",padding:"20px 14px"}}>
        <div style={{maxWidth:700,margin:"0 auto",width:"100%"}}>
          {page==="settings"       &&<Settings settings={settings} setSettings={setSettings}/>}
          {page==="adminAttendance"&&<AdminAttendance adminAttendance={adminAttendance} setAdminAttendance={setAdminAttendance} settings={settings}/>}
          {page==="students"       &&<Students students={students} setStudents={setStudents} teachers={teachers} enrollments={enrollments} setEnrollments={setEnrollments} settings={settings} results={results}/>}
          {page==="courses"        &&<Courses students={students} teachers={teachers} enrollments={enrollments} settings={settings}/>}
          {page==="teachers"       &&<Teachers teachers={teachers} setTeachers={setTeachers} students={students} enrollments={enrollments} setEnrollments={setEnrollments} settings={settings}/>}
          {page==="fees"           &&<Fees students={students} feeRecords={feeRecords} setFeeRecords={setFeeRecords} enrollments={enrollments} teachers={teachers} settings={settings}/>}
          {page==="teacherAttend"  &&<TeacherAttendance attendance={attendance} setAttendance={setAttendance} teachers={teachers} settings={settings}/>}
          {page==="results"        &&<Results results={results} setResults={setResults} students={students} teachers={teachers} settings={settings}/>}
          {page==="sideIncome"     &&<SideIncome sideIncome={sideIncome} setSideIncome={setSideIncome} students={students} settings={settings}/>}
          {page==="events"         &&<Events events={events} setEvents={setEvents} students={students}/>}
          {page==="expenses"       &&<Expenses expenses={expenses} setExpenses={setExpenses} settings={settings}/>}
          {page==="notices"        &&<Notices notices={notices} setNotices={setNotices}/>}
        </div>
      </main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
